; Loaded as zz-app.ini → sorts last → overrides image defaults.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

opcache.file_cache = /tmp/opcache
opcache.file_cache_consistency_checks = 0

; JIT miscompiles code inside the long-lived FrankenPHP worker.
opcache.jit = disable
opcache.jit_buffer_size = 0

expose_php = Off
zend.assertions = -1

; Interim CVE-2026-109618/CVE-2026-109619 mitigation from the php.net advisory; revert with the PHP 8.5.12 bump.
memory_limit = -1
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
