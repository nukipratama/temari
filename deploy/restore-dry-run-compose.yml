# Throwaway single-service MySQL for .github/workflows/restore-dry-run.yml.
# Same image and env_file as compose.prod.yaml's `mysql` service (so DB_* and
# MYSQL_ROOT_PASSWORD are identical, which scripts/restore-db.sh relies on),
# but brought up under its own compose project (`-p temari-restore`), with an
# anonymous volume and no published ports, so it never touches the live stack.
# Its network is internal (no route out), shared with the app_rehearsal overlay in deploy/restore-dry-run-rehearsal-compose.yml.
services:
  mysql_restore:
    image: temari/mysql:9.7
    pull_policy: never
    env_file:
      - /opt/temari/.env
    networks: [restore]
    volumes:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

networks:
  restore:
    internal: true
