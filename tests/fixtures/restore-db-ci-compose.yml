# Throwaway single-service stack for the nightly restore-db CI job
# (.github/workflows/nightly-audit.yml). Lets scripts/restore-db.sh run its
# real `docker compose exec` code path against a disposable database instead
# of compose.prod.yaml, via its COMPOSE_FILE/MYSQL_SERVICE overrides.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: temari_ci_restore
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
      # Read by restore-db.sh inside the container via `sh -c`, mirroring the
      # non-root DB_* vars compose.prod.yaml's env_file supplies in prod.
      DB_USERNAME: sail
      DB_PASSWORD: password
      DB_DATABASE: temari_ci_restore
    ports:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword"]
      interval: 5s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/mysql:rw
