name: Dependency review

# Blocks a PR that introduces a high+ severity advisory in composer.lock or
# package-lock.json, matching the nightly-audit.yml threshold but catching it
# before merge instead of on the next scheduled run. fail-on-scopes includes
# development on top of the default runtime, so a compromised build/test
# dependency is caught too — a compromised dependency still runs in CI even
# if it never ships in the built image.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
