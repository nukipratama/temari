name: Scratch shard probe

on:
  pull_request:
    paths:
      - .github/workflows/scratch-shard-probe.yml

permissions:
  contents: read

env:
  FILTER: NoSuchTestProfileProbe
  INI: >-
    opcache.enable=1,
    opcache.enable_cli=1,
    opcache.memory_consumption=256,
    opcache.max_accelerated_files=20000,
    opcache.validate_timestamps=0,
    opcache.jit=disable,
    opcache.jit_buffer_size=0

jobs:
  worker-boot:
    name: worker-boot (${{ matrix.coverage }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        coverage: [none, pcov]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: ${{ matrix.coverage }}
          ini-values: ${{ env.INI }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-

      - run: composer install --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - run: cp .env.example .env

      - name: Install strace
        continue-on-error: true
        run: sudo apt-get install -y -qq strace > /dev/null

      - name: Parallel no-match boot by process count
        env:
          APP_ENV: testing
        run: |
          t() { local l="$1"; shift; local s e; s=$(date +%s.%N); "$@" > /tmp/out.txt 2>&1 || true; e=$(date +%s.%N); printf 'PROBE %-40s %6.2fs\n' "$l" "$(echo "$e - $s" | bc)"; }
          php -m | grep -E -i 'pcov|opcache' | sed 's/^/MODULE /'
          for round in 1 2 3; do
            t "round$round artisan --version"        php artisan --version
            t "round$round autoload-only"            php -r 'require "vendor/autoload.php";'
            t "round$round list-tests (serial)"      php vendor/bin/pest --list-tests
            t "round$round serial no-match"          php vendor/bin/pest --filter=$FILTER --exclude-group=structure
            for p in 1 2 4; do
              t "round$round parallel p=$p no-match" php vendor/bin/pest --parallel --processes=$p --filter=$FILTER --exclude-group=structure
            done
          done
          grep -E 'Tests:|Duration:' /tmp/out.txt || true

      - name: Parallel no-match with pcov disabled
        if: matrix.coverage == 'pcov'
        env:
          APP_ENV: testing
        run: |
          t() { local l="$1"; shift; local s e; s=$(date +%s.%N); "$@" > /tmp/out.txt 2>&1 || true; e=$(date +%s.%N); printf 'PROBE %-40s %6.2fs\n' "$l" "$(echo "$e - $s" | bc)"; }
          scan=$(php --ini | sed -n 's/^Scan for additional .ini files in: *//p')
          echo "scan dir: $scan"
          for round in 1 2 3; do
            t "round$round -d pcov.enabled=0 p=4" php -d pcov.enabled=0 vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure
          done
          echo 'pcov.enabled=0' | sudo tee "$scan/99-probe-pcov-off.ini" > /dev/null
          for round in 1 2 3; do
            t "round$round pcov.enabled=0 via ini p=4" php vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure
          done
          sudo rm "$scan/99-probe-pcov-off.ini"

      - name: Parallel no-match with CLI opcache file cache
        env:
          APP_ENV: testing
        run: |
          t() { local l="$1"; shift; local s e; s=$(date +%s.%N); "$@" > /tmp/out.txt 2>&1 || true; e=$(date +%s.%N); printf 'PROBE %-40s %6.2fs\n' "$l" "$(echo "$e - $s" | bc)"; }
          scan=$(php --ini | sed -n 's/^Scan for additional .ini files in: *//p')
          mkdir -p /tmp/opcache
          printf 'opcache.file_cache=/tmp/opcache\nopcache.file_cache_consistency_checks=0\n' | sudo tee "$scan/99-probe-filecache.ini" > /dev/null
          t "filecache warm-up p=4" php vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure
          du -sh /tmp/opcache | sed 's/^/FILECACHE size /'
          for round in 1 2 3; do
            t "round$round filecache p=4"        php vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure
            t "round$round filecache serial"     php vendor/bin/pest --filter=$FILTER --exclude-group=structure
            t "round$round filecache list-tests" php vendor/bin/pest --list-tests
          done
          sudo rm "$scan/99-probe-filecache.ini"

      - name: Per-process lifetimes (parent and workers)
        env:
          APP_ENV: testing
        run: |
          cat > /tmp/stamp.php <<'PHP'
          <?php
          $argv0 = implode(' ', array_slice($_SERVER['argv'] ?? [], 0, 2));
          file_put_contents('/tmp/lifetimes.log', sprintf("%.3f pid=%d start %s\n", microtime(true), getmypid(), $argv0), FILE_APPEND);
          register_shutdown_function(fn () => file_put_contents('/tmp/lifetimes.log', sprintf("%.3f pid=%d end\n", microtime(true), getmypid()), FILE_APPEND));
          PHP
          scan=$(php --ini | sed -n 's/^Scan for additional .ini files in: *//p')
          echo 'auto_prepend_file=/tmp/stamp.php' | sudo tee "$scan/99-probe-stamp.ini" > /dev/null
          rm -f /tmp/lifetimes.log
          s=$(date +%s.%N)
          php vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure > /tmp/out.txt 2>&1 || true
          e=$(date +%s.%N)
          printf 'LIFETIME total wall %.2fs, epoch start %.3f\n' "$(echo "$e - $s" | bc)" "$s"
          sort -n /tmp/lifetimes.log | awk -v s="$s" '{printf "LIFETIME +%6.3fs %s %s %s %s\n", $1 - s, $2, $3, $4, $5}'
          sudo rm "$scan/99-probe-stamp.ini"

      - name: Spawn timeline (strace)
        continue-on-error: true
        env:
          APP_ENV: testing
        run: |
          strace -f -ttt -e trace=execve -o /tmp/strace.txt php vendor/bin/pest --parallel --processes=4 --filter=$FILTER --exclude-group=structure > /tmp/out.txt 2>&1 || true
          first=$(awk 'NR==1{print $2}' /tmp/strace.txt)
          grep 'execve(' /tmp/strace.txt | grep -v ENOENT | awk -v f="$first" '{printf "STRACE +%6.3fs %s\n", $2 - f, substr($0, index($0,"execve"), 150)}'

  php-preinstalled:
    name: php-preinstalled (${{ matrix.variant }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [control, preinstalled, update-false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MySQL
        run: |
          docker run -d --name mysql --tmpfs /var/lib/mysql:rw -p 127.0.0.1::3306 \
            -e MYSQL_ROOT_PASSWORD=password -e MYSQL_DATABASE=temari_testing \
            -e MYSQL_USER=sail -e MYSQL_PASSWORD=password \
            mysql:9.7@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497 \
            --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin --performance-schema=OFF \
            > "$RUNNER_TEMP/mysql-start.log" 2>&1 &

      - uses: ./.github/actions/start-redis
        with:
          wait: 'false'

      - name: Installed PHP before setup-php
        run: |
          php -v | head -1 | sed 's/^/BEFORE /'
          echo "SETUP_T0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Setup PHP (control, version 8.5)
        if: matrix.variant == 'control'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: ${{ env.INI }}

      - name: Setup PHP (pre-installed)
        if: matrix.variant == 'preinstalled'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: pre-installed
          coverage: pcov
          ini-values: ${{ env.INI }}

      - name: Setup PHP (version 8.5, update false)
        if: matrix.variant == 'update-false'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'false'
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: ${{ env.INI }}

      - name: Report setup-php
        run: |
          printf 'PROBE %s setup-php step wall %.2fs\n' "${{ matrix.variant }}" "$(echo "$(date +%s.%N) - $SETUP_T0" | bc)"
          php -v
          php -m | tr '\n' ' '; echo
          php --ini | sed 's/^/INI /'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-

      - run: composer install --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - run: cp .env.example .env

      - name: Wait for MySQL
        run: |
          until docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent 2>/dev/null; do sleep 1; done
          echo "DB_PORT=$(docker port mysql 3306/tcp | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/wait-redis

      - name: Tests (shard 1/3, pcov as on PRs)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: temari_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          SESSION_DRIVER: array
        run: |
          s=$(date +%s.%N)
          ./vendor/bin/pest --parallel --processes="$(nproc)" --shard=1/3 \
            --coverage-php=coverage-shard-1.cov --exclude-group=structure 2>&1 | tee /tmp/pest-output.txt
          rc=${PIPESTATUS[0]}
          printf 'PROBE %s real shard 1/3 wall %.2fs exit=%s\n' "${{ matrix.variant }}" "$(echo "$(date +%s.%N) - $s" | bc)" "$rc"
          exit "$rc"

  composer-seed:
    name: composer-seed
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: ${{ env.INI }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            bootstrap/cache
          key: probe-vendor-bootstrap-${{ github.run_id }}-${{ hashFiles('composer.lock') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: probe-vendor-only-${{ github.run_id }}-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Cache contents
        run: |
          du -sh vendor bootstrap/cache | sed 's/^/SIZE /'
          tar --zstd -cf - vendor | wc -c | awk '{printf "SIZE vendor zstd tar %.1f MB\n", $1 / 1048576}'
          grep -c 'setClassMapAuthoritative(true)' vendor/composer/autoload_real.php | sed 's/^/AUTHORITATIVE /'
          ls bootstrap/cache | sed 's/^/BOOTSTRAP /'
          ls -la .env.testing | sed 's/^/ENVTESTING /'

  composer-skip:
    name: composer-skip (${{ matrix.mode }})
    needs: composer-seed
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [install, skip-vendor-only, skip-vendor-bootstrap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MySQL
        run: |
          docker run -d --name mysql --tmpfs /var/lib/mysql:rw -p 127.0.0.1::3306 \
            -e MYSQL_ROOT_PASSWORD=password -e MYSQL_DATABASE=temari_testing \
            -e MYSQL_USER=sail -e MYSQL_PASSWORD=password \
            mysql:9.7@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497 \
            --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin --performance-schema=OFF \
            > "$RUNNER_TEMP/mysql-start.log" 2>&1 &

      - uses: ./.github/actions/start-redis
        with:
          wait: 'false'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: ${{ env.INI }}

      - id: vendor-only
        if: matrix.mode != 'skip-vendor-bootstrap'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: probe-vendor-only-${{ github.run_id }}-${{ hashFiles('composer.lock') }}

      - id: vendor-bootstrap
        if: matrix.mode == 'skip-vendor-bootstrap'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            bootstrap/cache
          key: probe-vendor-bootstrap-${{ github.run_id }}-${{ hashFiles('composer.lock') }}

      - name: Cache result and composer install timing
        run: |
          echo "PROBE cache-hit vendor-only=${{ steps.vendor-only.outputs.cache-hit }} vendor-bootstrap=${{ steps.vendor-bootstrap.outputs.cache-hit }}"
          ls bootstrap/cache | sed 's/^/BOOTSTRAP /'
          ls .env.testing 2>&1 | sed 's/^/ENVTESTING /'
          grep -c 'setClassMapAuthoritative(true)' vendor/composer/autoload_real.php | sed 's/^/AUTHORITATIVE /'
          if [ "${{ matrix.mode }}" = install ]; then
            for round in 1 2 3; do
              s=$(date +%s.%N)
              composer install --prefer-dist --no-interaction --no-progress --classmap-authoritative > /tmp/composer.txt 2>&1 || true
              printf 'PROBE composer install on cache hit round%s %.2fs\n' "$round" "$(echo "$(date +%s.%N) - $s" | bc)"
            done
            tail -5 /tmp/composer.txt
          else
            echo "PROBE composer install skipped"
          fi
          grep -c 'setClassMapAuthoritative(true)' vendor/composer/autoload_real.php | sed 's/^/AUTHORITATIVE-after /'
          ls bootstrap/cache | sed 's/^/BOOTSTRAP-after /'
          ls .env.testing 2>&1 | sed 's/^/ENVTESTING-after /'

      - run: cp .env.example .env

      - name: Add .env.testing for the skip-vendor-bootstrap mode
        if: matrix.mode == 'skip-vendor-bootstrap'
        run: cp .env.testing.example .env.testing

      - name: pest --list-tests
        env:
          APP_ENV: testing
        run: |
          s=$(date +%s.%N)
          ./vendor/bin/pest --list-tests > /tmp/list.txt 2>&1; rc=$?
          printf 'PROBE %s list-tests %.2fs exit=%s\n' "${{ matrix.mode }}" "$(echo "$(date +%s.%N) - $s" | bc)" "$rc"
          tail -3 /tmp/list.txt
          exit 0

      - name: Wait for services
        run: |
          until docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent 2>/dev/null; do sleep 1; done
          echo "DB_PORT=$(docker port mysql 3306/tcp | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/wait-redis

      - name: Tests (shard 1/3, pcov as on PRs)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: temari_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          SESSION_DRIVER: array
        run: |
          s=$(date +%s.%N)
          ./vendor/bin/pest --parallel --processes="$(nproc)" --shard=1/3 \
            --coverage-php=coverage-shard-1.cov --exclude-group=structure 2>&1 | tee /tmp/pest-output.txt
          rc=${PIPESTATUS[0]}
          printf 'PROBE %s real shard 1/3 wall %.2fs exit=%s\n' "${{ matrix.mode }}" "$(echo "$(date +%s.%N) - $s" | bc)" "$rc"
          exit "$rc"

  image-pull:
    name: image-pull
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Pull php:8.5-cli
        run: |
          uname -m
          for round in 1 2 3; do
            docker rmi -f php:8.5-cli > /dev/null 2>&1 || true
            s=$(date +%s.%N)
            docker pull -q php:8.5-cli > /dev/null
            printf 'PROBE docker pull php:8.5-cli round%s %.2fs\n' "$round" "$(echo "$(date +%s.%N) - $s" | bc)"
          done
          docker image inspect php:8.5-cli --format 'IMAGE uncompressed {{.Size}} bytes arch {{.Architecture}}'
          docker run --rm php:8.5-cli php -v | head -1
          digest=$(docker manifest inspect php:8.5-cli | jq -r '.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest' | head -1)
          docker manifest inspect "php@$digest" | jq -r '[.layers[].size] | add' | awk '{printf "IMAGE compressed layers %.1f MB\n", $1 / 1048576}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-php8.5-

      - name: Vendor cache size
        run: |
          echo "PROBE vendor cache-hit=${{ steps.vendor.outputs.cache-hit }} matched=${{ steps.vendor.outputs.cache-matched-key }}"
          du -sh vendor | sed 's/^/SIZE /'
          tar --zstd -cf - vendor | wc -c | awk '{printf "SIZE vendor zstd tar %.1f MB\n", $1 / 1048576}'
