name: Supply · Nightly dependency audit

# Scheduled supply-chain audits, so an upstream advisory cannot block an unrelated change on `main`.
# Neither audit job installs dependencies; both read the lock files directly.

on:
  schedule:
    # 03:17 WIB — off the hour, since on-the-hour crons queue behind everyone else's.
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'send a test message through the alert step without failing anything'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  composer-audit:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # --locked audits composer.lock itself, so no vendor install is needed.
      - name: Audit composer dependencies
        run: composer audit --locked --no-interaction

  # A separate job, not a second step: one ecosystem going red must not hide
  # whether the other one is clean.
  npm-audit:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # --package-lock-only builds the tree from package-lock.json, so this needs
      # no `npm ci`; --omit=dev then prunes dev-only advisories, which cannot
      # reach production (the image's assets stage never ships node_modules).
      - name: Audit npm dependencies (prod, high+)
        run: npm audit --omit=dev --audit-level=high --package-lock-only

      # Dev tooling runs on CI runners and developer machines, so a critical
      # advisory there is worth seeing, but it never ships and does not page.
      - name: Audit npm dependencies (dev included, critical, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=critical --package-lock-only

  notify:
    name: Audit alert
    needs: [composer-audit, npm-audit]
    if: always() && (needs.composer-audit.result == 'failure' || needs.npm-audit.result == 'failure' || inputs.test_alert == true)
    uses: ./.github/workflows/_alert.yml
    with:
      message: ${{ inputs.test_alert && 'temari supply audit test message, the alert path works.' || format('Nightly dependency audit failed (composer audit {0}, npm audit {1}).', needs.composer-audit.result, needs.npm-audit.result) }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
