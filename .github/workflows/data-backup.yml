name: Data · Nightly backup

# Scheduled database backup, independent of deploys, so there is always a recent restorable pair.
# A successful run triggers ops-disk.yml, which prunes the disk and checks binlog headroom.

on:
  schedule:
    - cron: '40 16 * * *' # 23:40 WIB
  workflow_dispatch:

concurrency:
  # Shares the deploy job's group: a backup dump must never overlap a deploy's
  # own migrate step touching the same schemas.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-backup:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f compose.prod.yaml
      BACKUP_DIR: /var/lib/temari-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute backup timestamp
        run: echo "NIGHTLY_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      # Named distinctly from deploy's `pre-deploy-*`/`analytics-pre-deploy-*` so
      # the two rotations, pruned independently by verify-and-prune-backup.sh,
      # never touch each other's files.
      - name: Backup DB
        timeout-minutes: 10
        run: |
          umask 077
          set -o pipefail
          DB_BACKUP_PASSWORD=$(scripts/deploy/backup-password.sh)
          echo "::add-mask::$DB_BACKUP_PASSWORD"
          export DB_BACKUP_PASSWORD
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          out="$BACKUP_DIR/nightly-$NIGHTLY_TIMESTAMP.sql.gz"
          manifest="$BACKUP_DIR/nightly-$NIGHTLY_TIMESTAMP.manifest"
          db_sql() {
            $COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c "export MYSQL_PWD=\"\$DB_BACKUP_PASSWORD\"; mysql -h 127.0.0.1 -N -B -utemari_backup \"\$DB_DATABASE\" -e \"$1\""
          }
          if ! { query=$(db_sql "SHOW TABLES" | scripts/deploy/count-rows-query.sh) && db_sql "$query" > "$manifest"; }; then
            rm -f "$manifest"
            echo "::warning::Nightly manifest not written; the weekly restore test skips its count check for this dump."
          fi
          # shellcheck disable=SC2016 # Database variables must expand inside the container shell.
          $COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c \
            'export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces --set-gtid-purged=COMMENTED --loose-skip-masking-policies -utemari_backup "$DB_DATABASE"' \
            | gzip > "$out"
          # shellcheck disable=SC2016 # Database variables must expand inside the container shell.
          tables=$($COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c \
            'export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysql -h 127.0.0.1 -N -utemari_backup -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""' \
            | tr -d '[:space:]')
          scripts/deploy/verify-and-prune-backup.sh "Nightly backup" "$out" "$tables" "$BACKUP_DIR/nightly-*.sql.gz" 14
          for m in "$BACKUP_DIR"/nightly-*.manifest; do
            [ -e "$m" ] || continue
            [ -e "${m%.manifest}.sql.gz" ] || rm -f "$m"
          done

      - name: Backup analytics schema
        timeout-minutes: 10
        run: |
          umask 077
          DB_BACKUP_PASSWORD=$(scripts/deploy/backup-password.sh)
          echo "::add-mask::$DB_BACKUP_PASSWORD"
          export DB_BACKUP_PASSWORD
          out="$BACKUP_DIR/analytics-nightly-$NIGHTLY_TIMESTAMP.sql.gz"
          # shellcheck disable=SC2016 # Analytics variables must expand inside the container shell.
          if $COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysql -h 127.0.0.1 -utemari_backup -e "USE $adb"' 2>/dev/null; then
            set -o pipefail
            manifest="$BACKUP_DIR/analytics-nightly-$NIGHTLY_TIMESTAMP.manifest"
            adb_sql() {
              $COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c "adb=\"\${DB_ANALYTICS_DATABASE:-temari_analytics}\"; export MYSQL_PWD=\"\$DB_BACKUP_PASSWORD\"; mysql -h 127.0.0.1 -N -B -utemari_backup \"\$adb\" -e \"$1\""
            }
            if ! { query=$(adb_sql "SHOW TABLES" | scripts/deploy/count-rows-query.sh) && adb_sql "$query" > "$manifest"; }; then
              rm -f "$manifest"
              echo "::warning::Nightly analytics manifest not written; the weekly restore test skips its count check for this dump."
            fi
            # shellcheck disable=SC2016 # Analytics variables must expand inside the container shell.
            $COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces --set-gtid-purged=COMMENTED --loose-skip-masking-policies -utemari_backup --databases "$adb"' \
              | gzip > "$out"
            # shellcheck disable=SC2016 # Analytics variables must expand inside the container shell.
            tables=$($COMPOSE exec -T -e DB_BACKUP_PASSWORD mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysql -h 127.0.0.1 -N -utemari_backup -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$adb\""' \
              | tr -d '[:space:]')
            scripts/deploy/verify-and-prune-backup.sh "Nightly analytics backup" "$out" "$tables" "$BACKUP_DIR/analytics-nightly-*.sql.gz" 14
            for m in "$BACKUP_DIR"/analytics-nightly-*.manifest; do
              [ -e "$m" ] || continue
              [ -e "${m%.manifest}.sql.gz" ] || rm -f "$m"
            done
          else
            echo "Analytics schema not present — skipping."
          fi

  notify:
    name: Backup alert
    needs: [nightly-backup]
    if: always() && needs.nightly-backup.result == 'failure'
    uses: ./.github/workflows/_alert.yml
    with:
      message: Nightly backup failed on the homelab runner. A silent backup failure is worse than none.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
