name: CI

on:
  pull_request:
  # `main` only: branch protection means everything else arrives via a PR, which
  # `pull_request` already covers — including a push to a long-lived `epic/*`,
  # since that updates the epic's own PR. Listing a branch here as well makes
  # both events fire on the same commit.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN across every job; a job that needs
# more widens it in its own permissions block.
permissions:
  contents: read

# Each context's checks live in its own reusable workflow, so the PR checks list reads
# `<context> / <check>` and this file stays orchestration plus the one required check.
jobs:
  # Diffs against the PR's *own* base branch, so filtering is correct whatever
  # the target; a hardcoded base saw the whole epic diff and never filtered
  # anything. A push skips this job and runs everything, having no base to diff against.
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      worktree: ${{ steps.filter.outputs.worktree }}
      structure: ${{ steps.filter.outputs.structure }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Explicit refspec: `git fetch origin <branch>` updates FETCH_HEAD but
          # does not reliably create refs/remotes/origin/<branch>, which is what
          # merge-base is asked for below.
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # Keep both sides of renames so a renamed-away input still selects its checks.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "diffing against ${BASE_REF} @ ${base:0:8}"
          printf '%s\n' "$changed" | sed 's/^/  /'

          checks="$(printf '%s\n' "$changed" | scripts/ci/classify-checks.sh)"
          printf '%s\n' "$checks"
          printf '%s\n' "$checks" >> "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.structure == 'true') }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      full: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}

  frontend:
    name: frontend
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    uses: ./.github/workflows/ci-frontend.yml

  repo:
    name: repo
    needs: [changes]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-repo.yml
    with:
      worktree: ${{ github.event_name != 'pull_request' || needs.changes.outputs.worktree == 'true' }}

  supply:
    name: supply
    uses: ./.github/workflows/ci-supply.yml

  image:
    name: image
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml
    with:
      inspect: ${{ needs.changes.outputs.image == 'true' }}

  # Single required check for branch protection.
  ci-gate:
    needs: [changes, backend, frontend, repo, supply, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - name: Require upstream jobs to have succeeded (or cleanly skipped)
        run: |
          require_if_changed() {
            local changed="$1" result="$2" job="$3"
            if [ "$changed" = "true" ]; then
              [ "$result" = "success" ] || { echo "::error::$job did not pass ($result)"; exit 1; }
            else
              [ "$result" = "success" ] || [ "$result" = "skipped" ] || { echo "::error::$job did not cleanly skip ($result)"; exit 1; }
            fi
          }

          require_if_changed "${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.structure == 'true' }}" "${{ needs.backend.result }}" backend
          require_if_changed "${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}" "${{ needs.frontend.result }}" frontend
          require_if_changed "${{ github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}" "${{ needs.image.result }}" image
          require_if_changed true "${{ needs.repo.result }}" repo
          require_if_changed true "${{ needs.supply.result }}" supply

          expected_changes=success
          [ "${{ github.event_name }}" = "pull_request" ] || expected_changes=skipped
          [ "${{ needs.changes.result }}" = "$expected_changes" ] || { echo "::error::changes did not run as expected (${{ needs.changes.result }})"; exit 1; }
