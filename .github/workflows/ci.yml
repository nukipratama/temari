name: CI

on:
  pull_request:
  # `main` only: branch protection means everything else arrives via a PR, which
  # `pull_request` already covers — including a push to a long-lived `epic/*`,
  # since that updates the epic's own PR. Listing a branch here as well makes
  # both events fire on the same commit.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN across every job; a job that needs
# more widens it in its own permissions block.
permissions:
  contents: read

# Each context's checks live in its own reusable workflow, so the PR checks list reads
# `<context> / <check>` and this file stays orchestration plus the one required check.
jobs:
  # The one place that decides which contexts run: the callers below and ci-gate
  # read the same run_* outputs. A PR diffs against its *own* base branch, so
  # filtering is correct whatever the target; a push has no base and runs everything.
  changes:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    outputs:
      run_backend: ${{ steps.decide.outputs.run_backend }}
      backend_full: ${{ steps.decide.outputs.backend_full }}
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
      run_worktree: ${{ steps.decide.outputs.run_worktree }}
      run_image: ${{ steps.decide.outputs.run_image }}
      image_inspect: ${{ steps.decide.outputs.image_inspect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Explicit refspec: `git fetch origin <branch>` updates FETCH_HEAD but
          # does not reliably create refs/remotes/origin/<branch>, which is what
          # merge-base is asked for below.
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # Keep both sides of renames so a renamed-away input still selects its checks.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "diffing against ${BASE_REF} @ ${base:0:8}"
          printf '%s\n' "$changed" | sed 's/^/  /'

          checks="$(printf '%s\n' "$changed" | scripts/ci/classify-checks.sh)"
          printf '%s\n' "$checks"
          printf '%s\n' "$checks" >> "$GITHUB_OUTPUT"

      - name: Decide which contexts run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WORKTREE: ${{ steps.filter.outputs.worktree }}
          STRUCTURE: ${{ steps.filter.outputs.structure }}
          IMAGE: ${{ steps.filter.outputs.image }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = pull_request ]; then
            backend=$BACKEND frontend=$FRONTEND docker=$DOCKER worktree=$WORKTREE structure=$STRUCTURE image=$IMAGE
          else
            backend=true frontend=true docker=true worktree=true structure=false image=false
          fi

          any() {
            for value in "$@"; do
              if [ "$value" = true ]; then echo true; return; fi
            done
            echo false
          }

          {
            echo "run_backend=$(any "$backend" "$structure")"
            echo "backend_full=$(any "$backend")"
            echo "run_frontend=$(any "$frontend")"
            echo "run_worktree=$(any "$worktree")"
            echo "run_image=$(any "$docker" "$backend" "$frontend")"
            echo "image_inspect=$(any "$image")"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: [changes]
    if: ${{ needs.changes.outputs.run_backend == 'true' }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      full: ${{ needs.changes.outputs.backend_full == 'true' }}

  frontend:
    name: frontend
    needs: [changes]
    if: ${{ needs.changes.outputs.run_frontend == 'true' }}
    uses: ./.github/workflows/ci-frontend.yml

  repo:
    name: repo
    needs: [changes]
    uses: ./.github/workflows/ci-repo.yml
    with:
      worktree: ${{ needs.changes.outputs.run_worktree == 'true' }}

  supply:
    name: supply
    uses: ./.github/workflows/ci-supply.yml

  image:
    name: image
    needs: [changes]
    if: ${{ needs.changes.outputs.run_image == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml
    with:
      inspect: ${{ needs.changes.outputs.image_inspect == 'true' }}

  # Single required check for branch protection.
  ci-gate:
    needs: [changes, backend, frontend, repo, supply, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - name: Require upstream jobs to have succeeded (or cleanly skipped)
        run: |
          require_if_changed() {
            local changed="$1" result="$2" job="$3"
            if [ "$changed" = "true" ]; then
              [ "$result" = "success" ] || { echo "::error::$job did not pass ($result)"; exit 1; }
            else
              [ "$result" = "success" ] || [ "$result" = "skipped" ] || { echo "::error::$job did not cleanly skip ($result)"; exit 1; }
            fi
          }

          require_if_changed true "${{ needs.changes.result }}" changes
          require_if_changed "${{ needs.changes.outputs.run_backend }}" "${{ needs.backend.result }}" backend
          require_if_changed "${{ needs.changes.outputs.run_frontend }}" "${{ needs.frontend.result }}" frontend
          require_if_changed "${{ needs.changes.outputs.run_image }}" "${{ needs.image.result }}" image
          require_if_changed true "${{ needs.repo.result }}" repo
          require_if_changed true "${{ needs.supply.result }}" supply
