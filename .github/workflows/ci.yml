name: CI

on:
  pull_request:
  # `main` only: branch protection means everything else arrives via a PR, which
  # `pull_request` already covers — including a push to a long-lived `epic/*`,
  # since that updates the epic's own PR. Listing a branch here as well makes
  # both events fire on the same commit.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  APP_IMAGE: ghcr.io/${{ github.repository }}/app

# Least-privilege default for GITHUB_TOKEN across every job; a job that needs
# more widens it in its own permissions block.
permissions:
  contents: read

jobs:
  # Diffs against the PR's *own* base branch, so filtering is correct whatever
  # the target; a hardcoded base saw the whole epic diff and never filtered
  # anything. A push runs everything, having no base to diff against.
  changes:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      worktree: ${{ steps.filter.outputs.worktree }}
      structure: ${{ steps.filter.outputs.structure }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push event - running everything"
            { echo "backend=true"; echo "frontend=true"; echo "docker=true"; echo "worktree=true"; echo "structure=false"; echo "image=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Explicit refspec: `git fetch origin <branch>` updates FETCH_HEAD but
          # does not reliably create refs/remotes/origin/<branch>, which is what
          # merge-base is asked for below.
          base_ref='${{ github.base_ref }}'
          git fetch --no-tags --quiet origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          base="$(git merge-base "origin/${base_ref}" HEAD)"
          # Keep both sides of renames so a renamed-away input still selects its checks.
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "diffing against ${base_ref} @ ${base:0:8}"
          printf '%s\n' "$changed" | sed 's/^/  /'

          checks="$(printf '%s\n' "$changed" | scripts/ci/classify-checks.sh)"
          printf '%s\n' "$checks"
          printf '%s\n' "$checks" >> "$GITHUB_OUTPUT"

  # Unfiltered: a deletion anywhere can orphan a doc citation, so this has to see
  # the whole tree. ci-gate requires it.
  repo-guards:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -config-file=.github/actionlint.yaml -shellcheck=shellcheck
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Check doc citations resolve
        run: php scripts/check-doc-citations.php

      - name: Reject unmarked destructive migrations
        env:
          MIGRATION_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-migration-safety.php --base "$MIGRATION_DIFF_BASE"

      - name: Scan for secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # High+ advisories in composer.lock or package-lock.json, dev scopes included,
  # block the PR through ci-gate. Skipped on a main push: there is no base to diff.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # Suite internals live in reusable workflows so this file stays focused on
  # orchestration and the one required branch-protection check.
  backend:
    name: backend
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: frontend
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-ci.yml

  worktree:
    name: worktree-races
    needs: [changes]
    if: ${{ needs.changes.outputs.worktree == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        backend: [perl, flock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the worktree race harness
        env:
          LOCK_BACKEND: ${{ matrix.backend }}
        run: |
          tests/scripts/worktree-races.sh "$LOCK_BACKEND" | tee "$RUNNER_TEMP/races.out"
          grep -qx "PASS: lock backend $LOCK_BACKEND" "$RUNNER_TEMP/races.out"

  structure:
    name: backend-structure
    needs: [changes]
    if: ${{ needs.changes.outputs.structure == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env for file-scanning tests
        run: cp .env.example .env

      - uses: ./.github/actions/start-redis

      - name: Backend structure tests
        env:
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --group=structure

  # Single required check for branch protection.
  ci-gate:
    needs: [changes, backend, frontend, build, worktree, structure, repo-guards, dependency-review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Require upstream jobs to have succeeded (or cleanly skipped)
        run: |
          require_if_changed() {
            local changed="$1" result="$2" job="$3"
            if [ "$changed" = "true" ]; then
              [ "$result" = "success" ] || { echo "::error::$job did not pass ($result)"; exit 1; }
            else
              [ "$result" = "success" ] || [ "$result" = "skipped" ] || { echo "::error::$job did not cleanly skip ($result)"; exit 1; }
            fi
          }

          require_if_changed "${{ needs.changes.outputs.backend }}" "${{ needs.backend.result }}" backend
          require_if_changed "${{ needs.changes.outputs.frontend }}" "${{ needs.frontend.result }}" frontend
          require_if_changed "${{ needs.changes.outputs.worktree }}" "${{ needs.worktree.result }}" worktree
          require_if_changed "${{ needs.changes.outputs.structure }}" "${{ needs.structure.result }}" backend-structure

          for r in "${{ needs.build.result }}" "${{ needs.dependency-review.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || { echo "::error::a required job did not pass ($r)"; exit 1; }
          done
          for r in "${{ needs.repo-guards.result }}" "${{ needs.changes.result }}"; do
            [ "$r" = "success" ] || { echo "::error::a required unconditional job did not pass ($r)"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'

      - name: Restore composer vendor
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-

      - name: Install composer deps
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true

      - name: Merge shard coverage and check --min=95 on the whole suite
        id: merge
        if: github.event_name == 'pull_request' && needs.backend.result == 'success'
        run: |
          ./vendor/bin/phpcov merge --clover=coverage-merged-clover.xml coverage-shards

          # shellcheck disable=SC2016 # PHP variables are evaluated by php, so the shell must leave this snippet literal.
          php -r '
            $xml = simplexml_load_file("coverage-merged-clover.xml");
            $metrics = $xml->project->metrics;
            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $pct = $statements > 0 ? ($covered / $statements) * 100 : 100.0;
            printf("Merged coverage: %.2f%% (%d/%d executable lines)\n", $pct, $covered, $statements);
            $min = 95.0;
            if ($pct < $min) {
              fwrite(STDERR, sprintf("FAIL: merged coverage %.1f%% is below the required %.1f%%.\n", floor($pct * 10) / 10, $min));
              exit(1);
            }
          '

      - name: Coverage summary
        if: always() && steps.merge.outcome != 'skipped'
        run: |
          {
            echo "### Backend · Coverage (merged, $(find coverage-shards -name '*.cov' | wc -l)-way shard)"
            echo ""
            if [ -f coverage-merged-clover.xml ]; then
              # shellcheck disable=SC2016 # PHP variables are evaluated by php, so the shell must leave this snippet literal.
              php -r '
              $xml = @simplexml_load_file("coverage-merged-clover.xml");
              if ($xml === false) { exit(0); }
              $metrics = $xml->project->metrics;
              $statements = (int) $metrics["statements"];
              $covered = (int) $metrics["coveredstatements"];
              $pct = $statements > 0 ? ($covered / $statements) * 100 : 100.0;
              echo "| | |\n| --- | --- |\n";
              printf("| Lines | %.1f%% (%d/%d) |\n", $pct, $covered, $statements);
              '
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Produces the image deploy.yml pulls after a main push, and on a PR proves a
  # Dockerfile/composer change still builds. ~40s off a warm cache.
  build:
    name: build-prod-image
    needs: [changes]
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A PR build validates only: it reads the shared buildcache but never
      # publishes a tag or writes the cache back, so it can't displace main's.
      - name: Build and push the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', env.APP_IMAGE) || '' }}
          provenance: false

      - name: Load the runtime image locally
        if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: temari-app:contents
          provenance: false

      - name: Assert the shipped app entries
        if: needs.changes.outputs.image == 'true'
        env:
          EXPECTED_ENTRIES: >-
            app artisan bootstrap composer.json composer.lock config database docker
            package-lock.json package.json public resources routes storage tsconfig.json
            vendor vite.config.ts
        run: |
          expected=$(tr -s ' ' '\n' <<< "$EXPECTED_ENTRIES" | sort)
          actual=$(docker run --rm --entrypoint ls temari-app:contents -A /var/www/html | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::/var/www/html differs from the expected entries. Change the .dockerignore allow-list and EXPECTED_ENTRIES together."
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
