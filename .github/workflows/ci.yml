name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PHP_VERSION: '8.5'
  APP_IMAGE: ghcr.io/${{ github.repository }}/app

# Least-privilege default for GITHUB_TOKEN across every job; a job that needs
# more widens it in its own permissions block.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Classify the push so each suite skips when its files weren't touched.
      # Shared-infra paths (ci.yml, Dockerfile, compose, .env.example) match
      # both, so an infra change runs the full pipeline. Diff is against the
      # merge-base with main; on main pushes both jobs run anyway (see the `if`).
      - name: Detect changed areas
        id: filter
        run: |
          git fetch --no-tags --quiet origin main
          changed=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          backend=false; frontend=false
          if printf '%s\n' "$changed" | grep -qE '^(app|bootstrap|config|database|routes|tests)/|^composer\.(json|lock)$|^phpunit\.xml$|^artisan$|^(phpstan|phpstan-baseline)\.neon$|^rector\.php$|^pint\.json$|^\.github/workflows/ci\.yml$|^docker/|^Dockerfile$|^compose[^/]*\.yaml$|^\.env\.example$'; then
            backend=true
          fi
          if printf '%s\n' "$changed" | grep -qE '^resources/(js|css|views)/|^public/|^package(-lock)?\.json$|^vite\.config\.ts$|^vitest\.config\.ts$|^tsconfig\.json$|^eslint\.config\.|^\.nvmrc$|^scripts/check-entry-chunks\.mjs$|^\.github/workflows/ci\.yml$|^docker/|^Dockerfile$|^compose[^/]*\.yaml$|^\.env\.example$'; then
            frontend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Result: backend=$backend frontend=$frontend"

  # Runs on every event, independent of the path filter.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # Runs on every event, independent of the path filter: a code deletion anywhere
  # can orphan a citation in docs/, so guard against "the doc references code that's gone".
  docs-citation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Check doc citations resolve
        run: php scripts/check-doc-citations.php

  backend-tests:
    needs: [changes, secret-scan, docs-citation-guard]
    if: ${{ needs.secret-scan.result == 'success' && needs.docs-citation-guard.result == 'success' && (needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: temari_testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports: ['0:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s --health-timeout=2s --health-retries=10
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/show-runner-resources
        with:
          workers-label: test workers

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}
          # pcov is only loaded where the coverage gate actually runs (see Tests).
          coverage: ${{ github.event_name == 'pull_request' && 'pcov' || 'none' }}
          classmap-authoritative: 'true'

      - name: Stub .env for file-scanning tests
        run: cp .env.example .env

      - name: Class/test 1:1 structure check
        run: ./vendor/bin/pest --group=structure

      - name: Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: temari_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          # The coverage gate is a merge gate, not a deploy gate: every commit
          # reaches main through a PR, where this runs with --min=95. Re-running
          # it on the main push would only put pcov instrumentation of a 2000+
          # test suite on the deploy critical path for an already-gated tree.
          coverage_flag=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            coverage_flag="--coverage --min=95"
          fi

          echo "Running Pest${coverage_flag:+ with coverage (--min=95)}"

          ./vendor/bin/pest --parallel --processes="$(nproc)" $coverage_flag \
            --exclude-group=structure \
            --fail-on-warning --fail-on-notice \
            --fail-on-deprecation --fail-on-risky \
            --fail-on-phpunit-warning --fail-on-phpunit-notice \
            --fail-on-phpunit-deprecation 2>&1 | tee /tmp/pest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Pest summary
        if: always()
        run: |
          {
            echo "### Backend · Tests (Pest)"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/pest-output.txt \
              | grep -E "^[[:space:]]*(Tests|Duration|Parallel):" \
              | sed -E 's/^[[:space:]]*([A-Za-z]+):[[:space:]]*/| \1 | /; s/$/ |/'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    needs: [changes, secret-scan, docs-citation-guard]
    if: ${{ needs.secret-scan.result == 'success' && needs.docs-citation-guard.result == 'success' && (needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/show-runner-resources
        with:
          workers-label: vitest workers

      - uses: ./.github/actions/setup-node

      - name: Component/test 1:1 structure check
        run: npx vitest run resources/js/test/structure.test.ts

      - name: Vitest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running Vitest without coverage"
            npm run test
          else
            echo "Running Vitest with coverage (threshold gate)"
            npm run test:coverage
          fi

      - name: Vitest summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Frontend · Tests (Vitest)"
              echo ""
              echo "| Metric | % | Covered / Total |"
              echo "| --- | --- | --- |"
              jq -r '.total | to_entries[] | select(.key as $k | ["lines","functions","statements","branches"] | index($k)) | "| \(.key | ascii_upcase[0:1] + .[1:]) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The only gate that reads the built bundle. Without it, a bundler
      # upgrade or a stray static import can put a chart engine or the
      # animation library back on every route's first paint with nothing
      # failing — which is exactly how the React-in-charts split survived.
      - name: Build assets
        run: npm run build

      - name: Entry chunk guard (first-paint budget)
        run: npm run check:chunks

  # Cold static analysis. Local pre-commit/caches can mask drift (unchanged
  # files skip re-analysis), so a fresh checkout here is the only place that
  # reliably catches new phpstan/rector/pint regressions. Pre-existing findings
  # are captured in phpstan-baseline.neon; this gate blocks anything NEW.
  backend-static-analysis:
    needs: [changes, secret-scan, docs-citation-guard]
    if: ${{ needs.secret-scan.result == 'success' && needs.docs-citation-guard.result == 'success' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env (larastan boots the app to resolve types)
        run: cp .env.example .env

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector --dry-run --no-progress-bar

  frontend-static-analysis:
    needs: [changes, secret-scan, docs-citation-guard]
    if: ${{ needs.secret-scan.result == 'success' && needs.docs-citation-guard.result == 'success' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

  # Single required check for branch protection.
  ci-gate:
    needs: [backend-tests, frontend-tests, backend-static-analysis, frontend-static-analysis, build, secret-scan, docs-citation-guard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs to have succeeded (or cleanly skipped)
        run: |
          for r in "${{ needs.backend-tests.result }}" "${{ needs.frontend-tests.result }}" "${{ needs.backend-static-analysis.result }}" "${{ needs.frontend-static-analysis.result }}" "${{ needs.build.result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || { echo "::error::a required job did not pass ($r)"; exit 1; }
          done
          for r in "${{ needs.secret-scan.result }}" "${{ needs.docs-citation-guard.result }}" "${{ needs.changes.result }}"; do
            [ "$r" = "success" ] || { echo "::error::a required unconditional job did not pass ($r)"; exit 1; }
          done

  build:
    name: build-prod-image
    needs: [changes, secret-scan, docs-citation-guard]
    if: ${{ needs.secret-scan.result == 'success' && needs.docs-citation-guard.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.APP_IMAGE }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy
    needs: ci-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # A job timeout is a cancellation, so `if: failure()` never runs. Overruns are
    # capped per step instead; this is a backstop above the sum of those caps.
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f compose.prod.yaml
      BACKUP_DIR: /var/lib/temari-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag current :latest as :previous (rollback target)
        run: |
          if docker image inspect temari/app:latest >/dev/null 2>&1; then
            docker tag temari/app:latest temari/app:previous
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image built on the hosted runner
        timeout-minutes: 15
        run: |
          docker pull "$APP_IMAGE:${{ github.sha }}"
          docker tag "$APP_IMAGE:${{ github.sha }}" temari/app:latest

      - name: Bring up the data + cache layer
        # redis-cache is named explicitly (not just pulled in via app's depends_on)
        # so a compose change to its command/healthcheck — e.g. adding requirepass —
        # actually recreates it here, before the app rolls and starts authing to it.
        run: $COMPOSE up -d --remove-orphans --wait --wait-timeout 300 mysql redis redis-cache

      - name: Tag new image with git SHA
        run: docker tag temari/app:latest temari/app:${{ github.sha }}

      # MYSQL_PWD (exported inside the container) instead of `-p"$pass"` so the
      # password never lands in the container process table / /proc/*/cmdline.
      - name: Backup DB before migrate
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p "$BACKUP_DIR"
          out="$BACKUP_DIR/pre-deploy-${{ github.sha }}.sql.gz"
          $COMPOSE exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces -u"$DB_USERNAME" "$DB_DATABASE"' \
            | gzip > "$out"
          tables=$($COMPOSE exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""' \
            | tr -d '[:space:]')
          scripts/deploy/verify-and-prune-backup.sh "Backup" "$out" "$tables" "$BACKUP_DIR/pre-deploy-*.sql.gz"

      - name: Backup analytics schema
        timeout-minutes: 5
        run: |
          out="$BACKUP_DIR/analytics-pre-deploy-${{ github.sha }}.sql.gz"
          if $COMPOSE exec -T mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" -e "USE $adb"' 2>/dev/null; then
            set -o pipefail
            $COMPOSE exec -T mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces -u"$DB_USERNAME" --databases "$adb"' \
              | gzip > "$out"
            tables=$($COMPOSE exec -T mysql sh -c 'adb="${DB_ANALYTICS_DATABASE:-temari_analytics}"; export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$adb\""' \
              | tr -d '[:space:]')
            scripts/deploy/verify-and-prune-backup.sh "Analytics backup" "$out" "$tables" "$BACKUP_DIR/analytics-pre-deploy-*.sql.gz"
          else
            echo "Analytics schema not present yet — skipping (first deploy)."
          fi

      - name: Quiesce scheduler + horizon before the roll
        run: $COMPOSE stop scheduler horizon || true

      # migrate:status --pending=1 exits non-zero when a schema has pending migrations.
      - name: Detect pending migrations (auto-rollback safety gate)
        run: |
          applied=false
          $COMPOSE run --rm app php artisan migrate:status --pending=1 >/dev/null 2>&1 || applied=true
          $COMPOSE run --rm app php artisan migrate:status --database=analytics --path=database/migrations/analytics --pending=1 >/dev/null 2>&1 || applied=true
          echo "MIGRATIONS_APPLIED=$applied" >> "$GITHUB_ENV"
          echo "Migrations pending this deploy: $applied"

      - name: Migrate (one-shot, on the new image)
        timeout-minutes: 10
        run: $COMPOSE run --rm app php artisan migrate --force

      - name: Migrate analytics schema
        timeout-minutes: 10
        run: $COMPOSE run --rm app php artisan migrate --database=analytics --path=database/migrations/analytics --force

      # Roll app + workers together: /up (VerifyDependencies) 500s unless Horizon is
      # running, so the healthcheck can't gate the app alone. A boot-broken image is
      # caught by the healthcheck and reverted by the failure-path auto-rollback below.
      - name: Roll app, workers + Pulse daemon onto the new image
        run: $COMPOSE up -d --no-deps app horizon pulse

      - name: Optimize caches
        run: $COMPOSE exec -T app php artisan optimize

      - name: Healthcheck
        run: |
          scripts/deploy/poll-health.sh http://127.0.0.1:7001/up \
            && echo "Healthcheck passed" \
            || { echo "Healthcheck failed"; exit 1; }

      - name: Smoke test
        run: |
          curl -fsS --max-time 10 -o /dev/null -w "login: HTTP %{http_code} in %{time_total}s\n" \
            http://127.0.0.1:7001/login
          # PWA assets must serve with the right MIME + cache headers. Asserting them
          # here catches a Caddyfile serving regression (e.g. the file copied to the
          # wrong path → default config with no header handles) before the deploy goes green.
          sw=$(curl -fsS --max-time 10 -D- -o /dev/null http://127.0.0.1:7001/sw.js)
          printf '%s' "$sw" | grep -qi '^content-type: *text/javascript' \
            || { echo "::error::/sw.js missing Content-Type text/javascript"; exit 1; }
          printf '%s' "$sw" | grep -qi '^cache-control: *no-cache' \
            || { echo "::error::/sw.js missing Cache-Control no-cache"; exit 1; }
          man=$(curl -fsS --max-time 10 -D- -o /dev/null http://127.0.0.1:7001/manifest.webmanifest)
          printf '%s' "$man" | grep -qi '^content-type: *application/manifest+json' \
            || { echo "::error::/manifest.webmanifest missing Content-Type application/manifest+json"; exit 1; }
          # The service worker's offline fallback. It must be a real static file:
          # if it ever 404s or gets routed through PHP, an offline user sees the
          # browser error page instead, and nothing else would surface that.
          off=$(curl -fsS --max-time 10 -D- -o /dev/null http://127.0.0.1:7001/offline.html)
          printf '%s' "$off" | grep -qi '^content-type: *text/html' \
            || { echo "::error::/offline.html missing Content-Type text/html"; exit 1; }
          echo "PWA assets OK: /sw.js + /manifest.webmanifest + /offline.html"

      - name: Resume scheduler (deploy green)
        run: $COMPOSE up -d --no-deps scheduler

      - name: Roll back on failure
        if: failure()
        timeout-minutes: 6
        run: |
          $COMPOSE start scheduler horizon pulse || true

          # App rollback is safe only when no migration ran this deploy.
          if [ "${MIGRATIONS_APPLIED:-true}" = "true" ]; then
            echo "::error::Deploy failed with migrations applied — not auto-rolling back. Recover with the 'Rollback prod' workflow, plus ./scripts/restore-db.sh <backup> if a migration was destructive."
          elif docker image inspect temari/app:previous >/dev/null 2>&1; then
            docker tag temari/app:previous temari/app:latest
            $COMPOSE up -d --no-deps app horizon pulse scheduler
            $COMPOSE exec -T app php artisan horizon:terminate || true
            scripts/deploy/poll-health.sh http://127.0.0.1:7001/up \
              && echo "Rolled back to :previous and healthy." \
              || echo "::warning::Rolled back to :previous but /up still failing — likely an infra fault, not the image."
          else
            echo "::warning::No :previous image to roll back to. App left on the failed image."
          fi

      # Best-effort push; run --rm boots on :latest (the good :previous after a rollback).
      - name: Alert on deploy failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ "${MIGRATIONS_APPLIED:-true}" = "true" ]; then
            note="migrations ran, manual recovery needed"
          else
            note="auto-rolled-back to :previous"
          fi
          $COMPOSE run --rm app php artisan deploy:alert "deploy ${{ github.sha }} failed ($note)" || true

      - name: Prune old temari images
        # Prune by TAG reference, never by image id: after a deploy the old image
        # carries both :previous (the rollback target) and its old :<sha>. Deleting
        # by id would drop the shared image and destroy the rollback target. Removing
        # only the stale :<sha> tag leaves :previous/:latest intact.
        if: always()
        continue-on-error: true
        run: |
          docker images "temari/app" --format "{{.Repository}}:{{.Tag}}" \
            | grep -vE ":(latest|previous|${{ github.sha }})$" \
            | xargs --no-run-if-empty -n1 docker rmi 2>/dev/null || true

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
