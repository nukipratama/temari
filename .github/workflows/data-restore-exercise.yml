name: Data · Restore exercise

# Runs scripts/restore-db.sh against a throwaway MySQL via the COMPOSE_FILE / MYSQL_SERVICE overrides,
# on a hosted runner so it does not compete with prod.

on:
  schedule:
    # 03:47 WIB — off the hour, since on-the-hour crons queue behind everyone else's, and clear of the 03:17 audit.
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  restore-db-exercise:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      FIXTURE_COMPOSE: tests/fixtures/restore-db-ci-compose.yml
      FIXTURE_DB: temari_ci_restore
      FIXTURE_ANALYTICS_DB: temari_ci_restore_analytics
      DB_BACKUP_PASSWORD: backup-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env
        run: cp .env.example .env

      - name: Start throwaway MySQL
        timeout-minutes: 5
        run: docker compose -f "$FIXTURE_COMPOSE" up -d --wait mysql

      - name: Create the read-only backup user, twice to prove it is idempotent
        timeout-minutes: 2
        run: |
          docker compose -f "$FIXTURE_COMPOSE" exec -T -e DB_BACKUP_PASSWORD mysql sh -s < scripts/deploy/ensure-backup-user.sh
          docker compose -f "$FIXTURE_COMPOSE" exec -T -e DB_BACKUP_PASSWORD mysql sh -s < scripts/deploy/ensure-backup-user.sh

      - name: Migrate a fresh schema and seed a sentinel row
        timeout-minutes: 5
        env:
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{ env.FIXTURE_DB }}
          DB_ANALYTICS_DATABASE: ${{ env.FIXTURE_ANALYTICS_DB }}
          DB_USERNAME: sail
          DB_PASSWORD: password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          port=$(docker compose -f "$FIXTURE_COMPOSE" port mysql 3306 | cut -d: -f2)

          # sail is only auto-granted on MYSQL_DATABASE, so the analytics schema
          # needs its own CREATE + GRANT as root, same as docker/mysql/init/01-databases.sh.
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -h 127.0.0.1 -uroot -e "
              CREATE DATABASE IF NOT EXISTS $DB_ANALYTICS_DATABASE;
              GRANT ALL PRIVILEGES ON $DB_ANALYTICS_DATABASE.* TO \"$DB_USERNAME\"@\"%\";
              FLUSH PRIVILEGES;
            "'

          DB_PORT="$port" php artisan migrate --force
          DB_PORT="$port" php artisan migrate --database=analytics --path=database/migrations/analytics --force

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_DATABASE" -e "
              CREATE TABLE restore_ci_sentinel (id INT PRIMARY KEY, note VARCHAR(255));
              INSERT INTO restore_ci_sentinel VALUES (1, \"restore-db-ci-sentinel\");
            "'

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_ANALYTICS_DATABASE" -e "
              CREATE TABLE restore_ci_analytics_sentinel (id INT PRIMARY KEY, note VARCHAR(255));
              INSERT INTO restore_ci_analytics_sentinel VALUES (1, \"restore-db-ci-analytics-sentinel\");
            "'

      - name: Dump the fixture (same user and mysqldump flags as the prod backup step)
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p /tmp/restore-ci
          before=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""')
          echo "TABLE_COUNT_BEFORE=$(echo "$before" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          before_analytics=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_ANALYTICS_DATABASE\""')
          echo "ANALYTICS_TABLE_COUNT_BEFORE=$(echo "$before_analytics" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          docker compose -f "$FIXTURE_COMPOSE" exec -T -e DB_BACKUP_PASSWORD mysql sh -c \
            'export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces --set-gtid-purged=COMMENTED --loose-skip-masking-policies -utemari_backup "$DB_DATABASE"' \
            | gzip > /tmp/restore-ci/fixture.sql.gz

          # --databases carries its own CREATE DATABASE/USE, matching the analytics
          # backup step in release-deploy.yml and restore-db.sh's `analytics-*` filename branch.
          docker compose -f "$FIXTURE_COMPOSE" exec -T -e DB_BACKUP_PASSWORD mysql sh -c \
            'export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces --set-gtid-purged=COMMENTED --loose-skip-masking-policies -utemari_backup --databases "$DB_ANALYTICS_DATABASE"' \
            | gzip > /tmp/restore-ci/analytics-fixture.sql.gz

      - name: Simulate a failed migration (leftover tables, lost rows)
        run: |
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_DATABASE" -e "
              CREATE TABLE restore_ci_leftover (id INT PRIMARY KEY);
              DELETE FROM restore_ci_sentinel;
            "'

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_ANALYTICS_DATABASE" -e "
              CREATE TABLE restore_ci_analytics_leftover (id INT PRIMARY KEY);
              DELETE FROM restore_ci_analytics_sentinel;
            "'

      - name: Restore over the failed migration, then after a disaster, via scripts/restore-db.sh
        timeout-minutes: 10
        env:
          COMPOSE_FILE: tests/fixtures/restore-db-ci-compose.yml
          MYSQL_SERVICE: mysql
          RESTORE_DB_ASSUME_YES: '1'
        run: |
          assert_restored() {
            after=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""')
            after="$(echo "$after" | tr -d '[:space:]')"

            if [ "$after" != "$TABLE_COUNT_BEFORE" ]; then
              echo "::error::table count after the restore $1 ($after) != at dump time ($TABLE_COUNT_BEFORE)"
              exit 1
            fi

            leftover=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\" AND table_name = \"restore_ci_leftover\""')
            leftover="$(echo "$leftover" | tr -d '[:space:]')"

            if [ "$leftover" != "0" ]; then
              echo "::error::restore_ci_leftover, created after the dump, survived the restore $1"
              exit 1
            fi

            note=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" "$DB_DATABASE" -e "SELECT note FROM restore_ci_sentinel WHERE id = 1"')
            note="$(echo "$note" | tr -d '[:space:]')"

            if [ "$note" != "restore-db-ci-sentinel" ]; then
              echo "::error::sentinel row missing or wrong after the restore $1: got '$note'"
              exit 1
            fi

            echo "Restore $1 verified: $after tables, no leftover table, sentinel row intact."

            after_analytics=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_ANALYTICS_DATABASE\""')
            after_analytics="$(echo "$after_analytics" | tr -d '[:space:]')"

            if [ "$after_analytics" != "$ANALYTICS_TABLE_COUNT_BEFORE" ]; then
              echo "::error::analytics table count after the restore $1 ($after_analytics) != at dump time ($ANALYTICS_TABLE_COUNT_BEFORE)"
              exit 1
            fi

            analytics_leftover=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_ANALYTICS_DATABASE\" AND table_name = \"restore_ci_analytics_leftover\""')
            analytics_leftover="$(echo "$analytics_leftover" | tr -d '[:space:]')"

            if [ "$analytics_leftover" != "0" ]; then
              echo "::error::restore_ci_analytics_leftover, created after the dump, survived the restore $1"
              exit 1
            fi

            analytics_note=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" "$DB_ANALYTICS_DATABASE" -e "SELECT note FROM restore_ci_analytics_sentinel WHERE id = 1"')
            analytics_note="$(echo "$analytics_note" | tr -d '[:space:]')"

            if [ "$analytics_note" != "restore-db-ci-analytics-sentinel" ]; then
              echo "::error::analytics sentinel row missing or wrong after the restore $1: got '$analytics_note'"
              exit 1
            fi

            echo "Analytics restore $1 verified: $after_analytics tables, no leftover table, sentinel row intact."
          }

          ./scripts/restore-db.sh /tmp/restore-ci/fixture.sql.gz
          ./scripts/restore-db.sh /tmp/restore-ci/analytics-fixture.sql.gz
          assert_restored "over the failed migration"

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" -e "DROP DATABASE $DB_DATABASE; CREATE DATABASE $DB_DATABASE;"'
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" -e "DROP DATABASE $DB_ANALYTICS_DATABASE;"'

          ./scripts/restore-db.sh /tmp/restore-ci/fixture.sql.gz
          ./scripts/restore-db.sh /tmp/restore-ci/analytics-fixture.sql.gz
          assert_restored "after a disaster (dropped schemas)"

      - name: Point-in-time replay to a sentinel written after the dump
        timeout-minutes: 10
        env:
          COMPOSE_FILE: tests/fixtures/restore-db-ci-compose.yml
          MYSQL_SERVICE: mysql
          RESTORE_DB_ASSUME_YES: '1'
        run: |
          set -o pipefail
          app_sql() {
            docker compose -f "$FIXTURE_COMPOSE" exec -T -e Q="$1" mysql sh -c \
              'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" "$DB_DATABASE" -e "$Q"'
          }

          docker compose -f "$FIXTURE_COMPOSE" exec -T -e DB_BACKUP_PASSWORD mysql sh -c \
            'export MYSQL_PWD="$DB_BACKUP_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces --set-gtid-purged=COMMENTED --loose-skip-masking-policies -utemari_backup "$DB_DATABASE"' \
            | gzip > /tmp/restore-ci/pitr.sql.gz

          app_sql "INSERT INTO restore_ci_sentinel VALUES (2, 'pitr-sentinel')"
          stop=$(app_sql "SELECT @@GLOBAL.gtid_executed" | tr -d '[:space:]')
          app_sql "INSERT INTO restore_ci_sentinel VALUES (3, 'after-the-stop-point')"

          ./scripts/restore-db.sh /tmp/restore-ci/pitr.sql.gz
          ./scripts/deploy/replay-binlogs.sh /tmp/restore-ci/pitr.sql.gz "$stop"

          rows=$(app_sql "SELECT GROUP_CONCAT(id ORDER BY id) FROM restore_ci_sentinel" | tr -d '[:space:]')
          if [ "$rows" != "1,2" ]; then
            echo "::error::after replaying to $stop the sentinel table holds ids '$rows', expected '1,2' (the dump's row, the sentinel, and nothing after it)"
            exit 1
          fi
          echo "Point-in-time replay verified: the sentinel written after the dump is back, the later row is not."

      - name: Tear down the throwaway stack
        if: always()
        run: docker compose -f "$FIXTURE_COMPOSE" down -v

  notify:
    name: Restore exercise alert
    needs: [restore-db-exercise]
    if: always() && needs.restore-db-exercise.result == 'failure'
    uses: ./.github/workflows/_alert.yml
    with:
      message: The restore-db exercise failed on a hosted runner, so scripts/restore-db.sh or the point-in-time replay may no longer bring back a dump.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
