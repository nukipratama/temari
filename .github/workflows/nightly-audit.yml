name: Nightly dependency audit

# Supply-chain audits are the one gate whose verdict does not depend on the
# diff: a freshly-published advisory against a package nobody in this PR touched
# turns `composer audit` / `npm audit` red, and on `main` that red sits in front
# of the deploy. Auditing on a schedule keeps the signal without letting an
# upstream disclosure block an unrelated change from shipping. Neither job
# installs dependencies — both read the lock files directly.
#
# Failure is visible as a red run in the Actions tab plus GitHub's own
# failed-scheduled-run notification, plus a direct Telegram push below. It
# deliberately does NOT go through MaintainerAlerter: that path is
# Telegram-over-the-prod-DB and is only reachable from inside the prod app
# container on the homelab runner, which this workflow does not touch (both
# audit jobs run on ubuntu-latest and read the lock files directly - no
# install, no homelab). The push needs its own `TELEGRAM_BOT_TOKEN` and
# `TELEGRAM_MAINTAINER_CHAT_ID` repository secrets; until both are set the
# alert step is a no-op skip (both jobs still fail/pass normally).

on:
  schedule:
    # 03:17 WIB — off the hour, since on-the-hour crons queue behind everyone else's.
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'send a test message through the alert step without failing anything'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # --locked audits composer.lock itself, so no vendor install is needed.
      - name: Audit composer dependencies
        run: composer audit --locked --no-interaction

  # A separate job, not a second step: one ecosystem going red must not hide
  # whether the other one is clean.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'

      # --package-lock-only builds the tree from package-lock.json, so this needs
      # no `npm ci`; --omit=dev then prunes dev-only advisories, which cannot
      # reach production (the image's assets stage never ships node_modules).
      - name: Audit npm dependencies (prod, high+)
        run: npm audit --omit=dev --audit-level=high --package-lock-only

  # DF-7/D3: scripts/restore-db.sh had no automated exercise — the deploy doc
  # said outright that restore has never fired even in prod, so the first real
  # use would also be its first test. This runs the script's real code path
  # (its flags, env expectations, the gzip/streaming restore) against a
  # throwaway MySQL instead of compose.prod.yaml, via the COMPOSE_FILE /
  # MYSQL_SERVICE overrides added alongside this job. ubuntu-latest, not the
  # self-hosted homelab runner: no reason to compete with prod for the shared
  # 4 cores, and a runner-local docker compose stack needs no bind mounts (the
  # dump moves through a pipe, same as the prod backup step) so the homelab's
  # docker-out-of-docker quirk doesn't apply here anyway.
  restore-db-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIXTURE_COMPOSE: tests/fixtures/restore-db-ci-compose.yml
      FIXTURE_DB: temari_ci_restore
      FIXTURE_ANALYTICS_DB: temari_ci_restore_analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env
        run: cp .env.example .env

      - name: Start throwaway MySQL
        timeout-minutes: 5
        run: docker compose -f "$FIXTURE_COMPOSE" up -d --wait mysql

      - name: Migrate a fresh schema and seed a sentinel row
        timeout-minutes: 5
        env:
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{ env.FIXTURE_DB }}
          DB_ANALYTICS_DATABASE: ${{ env.FIXTURE_ANALYTICS_DB }}
          DB_USERNAME: sail
          DB_PASSWORD: password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          port=$(docker compose -f "$FIXTURE_COMPOSE" port mysql 3306 | cut -d: -f2)

          # sail is only auto-granted on MYSQL_DATABASE, so the analytics schema
          # needs its own CREATE + GRANT as root, same as docker/mysql/init/01-databases.sh.
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -h 127.0.0.1 -uroot -e "
              CREATE DATABASE IF NOT EXISTS $DB_ANALYTICS_DATABASE;
              GRANT ALL PRIVILEGES ON $DB_ANALYTICS_DATABASE.* TO \"$DB_USERNAME\"@\"%\";
              FLUSH PRIVILEGES;
            "'

          DB_PORT="$port" php artisan migrate --force
          DB_PORT="$port" php artisan migrate --database=analytics --path=database/migrations/analytics --force

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_DATABASE" -e "
              CREATE TABLE restore_ci_sentinel (id INT PRIMARY KEY, note VARCHAR(255));
              INSERT INTO restore_ci_sentinel VALUES (1, \"restore-db-ci-sentinel\");
            "'

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" "$DB_ANALYTICS_DATABASE" -e "
              CREATE TABLE restore_ci_analytics_sentinel (id INT PRIMARY KEY, note VARCHAR(255));
              INSERT INTO restore_ci_analytics_sentinel VALUES (1, \"restore-db-ci-analytics-sentinel\");
            "'

      - name: Dump the fixture (same mysqldump flags as the prod backup step)
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p /tmp/restore-ci
          before=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""')
          echo "TABLE_COUNT_BEFORE=$(echo "$before" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          before_analytics=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_ANALYTICS_DATABASE\""')
          echo "ANALYTICS_TABLE_COUNT_BEFORE=$(echo "$before_analytics" | tr -d '[:space:]')" >> "$GITHUB_ENV"

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces -u"$DB_USERNAME" "$DB_DATABASE"' \
            | gzip > /tmp/restore-ci/fixture.sql.gz

          # --databases carries its own CREATE DATABASE/USE, matching the analytics
          # backup step in ci.yml and restore-db.sh's `analytics-*` filename branch.
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysqldump -h 127.0.0.1 --single-transaction --quick --no-tablespaces -u"$DB_USERNAME" --databases "$DB_ANALYTICS_DATABASE"' \
            | gzip > /tmp/restore-ci/analytics-fixture.sql.gz

      - name: Simulate a disaster (drop the schemas)
        run: |
          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" -e "DROP DATABASE $DB_DATABASE; CREATE DATABASE $DB_DATABASE;"'

          docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -u"$DB_USERNAME" -e "DROP DATABASE $DB_ANALYTICS_DATABASE;"'

      - name: Restore via scripts/restore-db.sh
        timeout-minutes: 5
        env:
          COMPOSE_FILE: tests/fixtures/restore-db-ci-compose.yml
          MYSQL_SERVICE: mysql
          RESTORE_DB_ASSUME_YES: '1'
        run: |
          ./scripts/restore-db.sh /tmp/restore-ci/fixture.sql.gz
          ./scripts/restore-db.sh /tmp/restore-ci/analytics-fixture.sql.gz

      - name: Assert the restore actually restored the data
        run: |
          after=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_DATABASE\""')
          after="$(echo "$after" | tr -d '[:space:]')"

          if [ "$after" != "$TABLE_COUNT_BEFORE" ]; then
            echo "::error::table count after restore ($after) != before the disaster ($TABLE_COUNT_BEFORE)"
            exit 1
          fi

          note=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" "$DB_DATABASE" -e "SELECT note FROM restore_ci_sentinel WHERE id = 1"')
          note="$(echo "$note" | tr -d '[:space:]')"

          if [ "$note" != "restore-db-ci-sentinel" ]; then
            echo "::error::sentinel row missing or wrong after restore: got '$note'"
            exit 1
          fi

          echo "Restore verified: $after tables, sentinel row intact."

          after_analytics=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$DB_ANALYTICS_DATABASE\""')
          after_analytics="$(echo "$after_analytics" | tr -d '[:space:]')"

          if [ "$after_analytics" != "$ANALYTICS_TABLE_COUNT_BEFORE" ]; then
            echo "::error::analytics table count after restore ($after_analytics) != before the disaster ($ANALYTICS_TABLE_COUNT_BEFORE)"
            exit 1
          fi

          analytics_note=$(docker compose -f "$FIXTURE_COMPOSE" exec -T mysql sh -c \
            'export MYSQL_PWD="$DB_PASSWORD"; mysql -h 127.0.0.1 -N -u"$DB_USERNAME" "$DB_ANALYTICS_DATABASE" -e "SELECT note FROM restore_ci_analytics_sentinel WHERE id = 1"')
          analytics_note="$(echo "$analytics_note" | tr -d '[:space:]')"

          if [ "$analytics_note" != "restore-db-ci-analytics-sentinel" ]; then
            echo "::error::analytics sentinel row missing or wrong after restore: got '$analytics_note'"
            exit 1
          fi

          echo "Analytics restore verified: $after_analytics tables, sentinel row intact."

      - name: Tear down the throwaway stack
        if: always()
        run: docker compose -f "$FIXTURE_COMPOSE" down -v

  # Separate job so it can run `if: always()` and read both jobs' results,
  # rather than duplicating the push as a failure step inside each of them.
  alert-on-failure:
    needs: [composer-audit, npm-audit, restore-db-exercise]
    if: always() && (needs.composer-audit.result == 'failure' || needs.npm-audit.result == 'failure' || needs.restore-db-exercise.result == 'failure' || inputs.test_alert == true)
    runs-on: ubuntu-latest
    steps:
      - name: Push a Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
          COMPOSER_RESULT: ${{ needs.composer-audit.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
          RESTORE_RESULT: ${{ needs.restore-db-exercise.result }}
          TEST_ALERT: ${{ inputs.test_alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_MAINTAINER_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_MAINTAINER_CHAT_ID not set, skipping the push (see the workflow's top comment)."
            exit 0
          fi

          if [ "$TEST_ALERT" = "true" ]; then
            message="temari nightly audit: test message, the alert path works (run $RUN_URL)"
          else
            failed=""
            [ "$COMPOSER_RESULT" = "failure" ] && failed="${failed:+$failed, }composer audit"
            [ "$NPM_RESULT" = "failure" ] && failed="${failed:+$failed, }npm audit"
            [ "$RESTORE_RESULT" = "failure" ] && failed="${failed:+$failed, }restore-db exercise"

            message="Nightly dependency audit failed ($failed). Check the run: $RUN_URL"
          fi

          curl -sS --fail-with-body \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_MAINTAINER_CHAT_ID}" \
            --data-urlencode text="$message"
