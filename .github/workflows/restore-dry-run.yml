name: Restore dry-run

# Restores a real prod backup pair with scripts/restore-db.sh into a throwaway
# MySQL instead of the live one, weekly for the newest nightly pair and on demand
# for either kind. See the "Rollback" section of docs/architecture/deployment.md.

on:
  schedule:
    - cron: '7 21 * * 6' # Sunday 04:07 WIB
  workflow_dispatch:
    inputs:
      kind:
        description: 'which backup rotation to restore'
        type: choice
        options: [nightly, pre-deploy]
        default: nightly
      backup_sha:
        description: 'kind=pre-deploy only: git SHA of the pre-deploy-<sha>-*.sql.gz pair to restore (default: newest on disk)'
        required: false
        default: ''

concurrency:
  # Shares the deploy job's group: a dry run must never overlap a real deploy
  # (or a rollback) touching the same host.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore-dry-run:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 45
    env:
      BACKUP_DIR: /var/lib/temari-backups
      LIVE_COMPOSE: docker compose -f compose.prod.yaml
      LIVE_SERVICE: mysql
      RESTORE_COMPOSE_FILE: deploy/restore-dry-run-compose.yml
      RESTORE_PROJECT: temari-restore
      RESTORE_SERVICE: mysql_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the backup pair
        id: pick
        timeout-minutes: 2
        env:
          KIND: ${{ inputs.kind || 'nightly' }}
          BACKUP_SHA: ${{ inputs.backup_sha }}
        run: |
          set -euo pipefail

          case "$KIND" in
            nightly | pre-deploy) ;;
            *) echo "::error::unknown kind '$KIND' (nightly or pre-deploy)"; exit 1 ;;
          esac

          # Pairing is by matching suffix: whatever comes after "nightly-" or
          # "pre-deploy-" (timestamp, plus sha + run id + run attempt for deploy
          # backups) is identical between a main dump and its analytics sibling,
          # just under the "analytics-" prefix.
          if [ -n "$BACKUP_SHA" ]; then
            [ "$KIND" = "pre-deploy" ] || { echo "::error::backup_sha only applies to kind=pre-deploy"; exit 1; }
            # shellcheck disable=SC2012 # Generated backup filenames contain no whitespace.
            app=$(ls -1t "$BACKUP_DIR"/pre-deploy-"$BACKUP_SHA"-*.sql.gz 2>/dev/null | head -n1 || true)
            [ -n "$app" ] || { echo "::error::no backup found for sha $BACKUP_SHA in $BACKUP_DIR"; exit 1; }
          else
            # shellcheck disable=SC2012 # Generated backup filenames contain no whitespace.
            app=$(ls -1t "$BACKUP_DIR"/"$KIND"-*.sql.gz 2>/dev/null | head -n1 || true)
            [ -n "$app" ] || { echo "::error::no $KIND-*.sql.gz found in $BACKUP_DIR"; exit 1; }
          fi

          analytics="$BACKUP_DIR/analytics-$(basename "$app")"
          [ -f "$analytics" ] || { echo "::error::no matching analytics backup at $analytics"; exit 1; }

          {
            echo "app=$app"
            echo "analytics=$analytics"
            echo "label=$(basename "$app")"
            echo "app_manifest=${app%.sql.gz}.manifest"
            echo "analytics_manifest=${analytics%.sql.gz}.manifest"
          } >> "$GITHUB_OUTPUT"

          echo "Selected pair ($(basename "$app")):"
          ls -lh "$app" "$analytics"

      - name: Bring up the throwaway MySQL
        timeout-minutes: 5
        run: docker compose -p "$RESTORE_PROJECT" -f "$RESTORE_COMPOSE_FILE" up -d --wait --wait-timeout 120 "$RESTORE_SERVICE"

      - name: Restore the app dump into the throwaway
        timeout-minutes: 10
        env:
          COMPOSE_FILE: deploy/restore-dry-run-compose.yml
          MYSQL_SERVICE: mysql_restore
          COMPOSE_PROJECT: temari-restore
          RESTORE_DB_ASSUME_YES: '1'
        run: ./scripts/restore-db.sh "${{ steps.pick.outputs.app }}"

      - name: Restore the analytics dump into the throwaway
        timeout-minutes: 10
        env:
          COMPOSE_FILE: deploy/restore-dry-run-compose.yml
          MYSQL_SERVICE: mysql_restore
          COMPOSE_PROJECT: temari-restore
          RESTORE_DB_ASSUME_YES: '1'
        run: ./scripts/restore-db.sh "${{ steps.pick.outputs.analytics }}"

      # A nightly pair is checked against the manifest its backup wrote just before
      # dumping; a pre-deploy pair, taken minutes before a deploy, against the live
      # mysql, read-only (SELECT COUNT / SHOW TABLES only, never a write).
      - name: Verify the restore
        id: verify
        timeout-minutes: 5
        env:
          KIND: ${{ inputs.kind || 'nightly' }}
          APP_MANIFEST: ${{ steps.pick.outputs.app_manifest }}
          ANALYTICS_MANIFEST: ${{ steps.pick.outputs.analytics_manifest }}
        run: |
          set -euo pipefail

          sql() { # $1=compose cmd  $2=service  $3=query, against $DB_DATABASE
            $1 exec -T "$2" sh -c "export MYSQL_PWD=\"\$DB_PASSWORD\"; mysql -h 127.0.0.1 -N -u\"\$DB_USERNAME\" \"\$DB_DATABASE\" -e \"$3\""
          }

          sql_analytics() { # same, against $DB_ANALYTICS_DATABASE
            $1 exec -T "$2" sh -c "adb=\"\${DB_ANALYTICS_DATABASE:-temari_analytics}\"; export MYSQL_PWD=\"\$DB_PASSWORD\"; mysql -h 127.0.0.1 -N -u\"\$DB_USERNAME\" \"\$adb\" -e \"$3\""
          }

          fail=0

          check_tables() { # $1=sql-fn  label
            local fn="$1" label="$2"
            local live_tables throwaway_tables missing
            live_tables=$("$fn" "$LIVE_COMPOSE" "$LIVE_SERVICE" "SHOW TABLES" | sort)
            throwaway_tables=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SHOW TABLES" | sort)
            missing=$(comm -23 <(printf '%s\n' "$live_tables") <(printf '%s\n' "$throwaway_tables"))
            if [ -n "$missing" ]; then
              echo "::error::$label — tables missing from the throwaway restore:"
              printf '%s\n' "$missing"
              fail=1
            else
              echo "$label — throwaway has every live table."
            fi
          }

          check_counts() { # $1=sql-fn  $2=schema  $3=table
            local fn="$1" schema="$2" table="$3" live_n throwaway_n live_status throwaway_status live_err throwaway_err
            live_err="$(mktemp)"
            throwaway_err="$(mktemp)"
            if live_n=$("$fn" "$LIVE_COMPOSE" "$LIVE_SERVICE" "SELECT COUNT(*) FROM $table" 2>"$live_err"); then
              live_status=0
            else
              live_status=$?
            fi
            if throwaway_n=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SELECT COUNT(*) FROM $table" 2>"$throwaway_err"); then
              throwaway_status=0
            else
              throwaway_status=$?
            fi
            if ! scripts/deploy/check-restore-counts.sh "$schema" "$table" "$live_status" "$live_n" "$throwaway_status" "$throwaway_n" "$live_err" "$throwaway_err"; then
              fail=1
            fi
            rm -f "$live_err" "$throwaway_err"
          }

          check_manifest() { # $1=sql-fn  $2=schema  $3=manifest
            local fn="$1" schema="$2" manifest="$3" query restored
            if [ ! -f "$manifest" ]; then
              echo "::warning::$schema — no manifest at $manifest, so this dump predates manifests; count check skipped."
              return 0
            fi
            query=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SHOW TABLES" | scripts/deploy/count-rows-query.sh)
            restored="$(mktemp)"
            "$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "$query" > "$restored"
            if ! scripts/deploy/check-restore-manifest.sh "$schema" "$manifest" "$restored"; then
              fail=1
            fi
            rm -f "$restored"
          }

          if [ "$KIND" = "nightly" ]; then
            echo "== default schema (against the dump-time manifest) =="
            check_manifest sql "default" "$APP_MANIFEST"

            echo "== analytics schema (against the dump-time manifest) =="
            check_manifest sql_analytics "analytics" "$ANALYTICS_MANIFEST"
          else
            echo "== default schema =="
            check_tables sql "default"
            for t in users activities ai_analyses planned_sessions; do
              check_counts sql "default" "$t"
            done

            echo "== analytics schema =="
            check_tables sql_analytics "analytics"
            check_counts sql_analytics "analytics" ai_token_usages
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::restore dry-run FAILED verification"
            exit 1
          fi
          echo "restore dry-run PASSED verification"

      - name: Tear down the throwaway stack
        if: always()
        run: |
          docker compose -p "$RESTORE_PROJECT" -f "$RESTORE_COMPOSE_FILE" down -v
          {
            echo "## Restore dry-run"
            if [ "${{ job.status }}" = "success" ]; then
              echo "PASS — \`${{ steps.pick.outputs.label }}\` restored clean into a throwaway database and verified (nightly: against its dump-time manifest; pre-deploy: against live)."
            else
              echo "FAIL — \`${{ steps.pick.outputs.label }}\`, see the Verify step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [restore-dry-run]
    if: always() && needs.restore-dry-run.result == 'failure'
    uses: ./.github/workflows/maintainer-alert.yml
    with:
      message: Restore dry-run (${{ inputs.kind || 'nightly' }}) failed on the homelab runner, possibly before any step ran.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
