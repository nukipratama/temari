name: Restore dry-run

# Restores a real prod backup pair with scripts/restore-db.sh into a throwaway
# MySQL instead of the live one, weekly for the newest nightly pair and on demand
# for either kind. See the "Rollback" section of docs/architecture/deployment.md.
# With a `ref`, a hosted job builds that ref's image and the restore is migrated with it.

on:
  schedule:
    - cron: '7 21 * * 6' # Sunday 04:07 WIB
  workflow_dispatch:
    inputs:
      kind:
        description: 'which backup rotation to restore'
        type: choice
        options: [nightly, pre-deploy]
        default: nightly
      backup_sha:
        description: 'kind=pre-deploy only: git SHA of the pre-deploy-<sha>-*.sql.gz pair to restore (default: newest on disk)'
        required: false
        default: ''
      ref:
        description: 'a branch, tag or sha whose image migrates the restore (empty keeps today''s restore-and-verify only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build-rehearsal-image
    if: inputs.ref != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}/app
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image: ${{ env.APP_IMAGE }}:${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the ref to a full sha
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # deploy.yml pulls app:<sha>, so a tag that already exists is reused, never re-pushed.
      - name: Check for an existing image tag
        id: existing
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          image="$APP_IMAGE:$SHA"
          if err=$(docker buildx imagetools inspect "$image" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$image already exists; the rehearsal pulls it and pushes nothing."
          else
            case "$err" in
              *': not found') echo "exists=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::could not inspect $image: $err"; exit 1 ;;
            esac
          fi

      - name: Build and push the rehearsal image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ steps.resolve.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          provenance: false

  restore-dry-run:
    needs: [build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: read
    concurrency:
      # Shares the deploy job's group: a dry run must never overlap a real deploy
      # (or a rollback) touching the same host.
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      BACKUP_DIR: /var/lib/temari-backups
      LIVE_COMPOSE: docker compose -f compose.prod.yaml
      LIVE_SERVICE: mysql
      RESTORE_COMPOSE_FILE: deploy/restore-dry-run-compose.yml
      RESTORE_PROJECT: temari-restore
      RESTORE_SERVICE: mysql_restore
      REHEARSAL_COMPOSE: docker compose -p temari-restore -f deploy/restore-dry-run-compose.yml -f deploy/restore-dry-run-rehearsal-compose.yml
      REF: ${{ inputs.ref }}
      REHEARSAL_SHA: ${{ needs.build.outputs.sha }}
      REHEARSAL_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the backup pair
        id: pick
        timeout-minutes: 2
        env:
          KIND: ${{ inputs.kind || 'nightly' }}
          BACKUP_SHA: ${{ inputs.backup_sha }}
        run: |
          set -euo pipefail

          case "$KIND" in
            nightly | pre-deploy) ;;
            *) echo "::error::unknown kind '$KIND' (nightly or pre-deploy)"; exit 1 ;;
          esac

          # Pairing is by matching suffix: whatever comes after "nightly-" or
          # "pre-deploy-" (timestamp, plus sha + run id + run attempt for deploy
          # backups) is identical between a main dump and its analytics sibling,
          # just under the "analytics-" prefix.
          if [ -n "$BACKUP_SHA" ]; then
            [ "$KIND" = "pre-deploy" ] || { echo "::error::backup_sha only applies to kind=pre-deploy"; exit 1; }
            # shellcheck disable=SC2012 # Generated backup filenames contain no whitespace.
            app=$(ls -1t "$BACKUP_DIR"/pre-deploy-"$BACKUP_SHA"-*.sql.gz 2>/dev/null | head -n1 || true)
            [ -n "$app" ] || { echo "::error::no backup found for sha $BACKUP_SHA in $BACKUP_DIR"; exit 1; }
          else
            # shellcheck disable=SC2012 # Generated backup filenames contain no whitespace.
            app=$(ls -1t "$BACKUP_DIR"/"$KIND"-*.sql.gz 2>/dev/null | head -n1 || true)
            [ -n "$app" ] || { echo "::error::no $KIND-*.sql.gz found in $BACKUP_DIR"; exit 1; }
          fi

          analytics="$BACKUP_DIR/analytics-$(basename "$app")"
          [ -f "$analytics" ] || { echo "::error::no matching analytics backup at $analytics"; exit 1; }

          {
            echo "app=$app"
            echo "analytics=$analytics"
            echo "label=$(basename "$app")"
            echo "app_manifest=${app%.sql.gz}.manifest"
            echo "analytics_manifest=${analytics%.sql.gz}.manifest"
          } >> "$GITHUB_OUTPUT"

          echo "Selected pair ($(basename "$app")):"
          ls -lh "$app" "$analytics"

      - name: Bring up the throwaway MySQL
        timeout-minutes: 5
        run: docker compose -p "$RESTORE_PROJECT" -f "$RESTORE_COMPOSE_FILE" up -d --wait --wait-timeout 120 "$RESTORE_SERVICE"

      - name: Restore the app dump into the throwaway
        timeout-minutes: 10
        env:
          COMPOSE_FILE: deploy/restore-dry-run-compose.yml
          MYSQL_SERVICE: mysql_restore
          COMPOSE_PROJECT: temari-restore
          RESTORE_DB_ASSUME_YES: '1'
        run: ./scripts/restore-db.sh "${{ steps.pick.outputs.app }}"

      - name: Restore the analytics dump into the throwaway
        timeout-minutes: 10
        env:
          COMPOSE_FILE: deploy/restore-dry-run-compose.yml
          MYSQL_SERVICE: mysql_restore
          COMPOSE_PROJECT: temari-restore
          RESTORE_DB_ASSUME_YES: '1'
        run: ./scripts/restore-db.sh "${{ steps.pick.outputs.analytics }}"

      # A nightly pair is checked against the manifest its backup wrote just before
      # dumping; a pre-deploy pair, taken minutes before a deploy, against the live
      # mysql, read-only (SELECT COUNT / SHOW TABLES only, never a write).
      - name: Verify the restore
        id: verify
        timeout-minutes: 5
        env:
          KIND: ${{ inputs.kind || 'nightly' }}
          APP_MANIFEST: ${{ steps.pick.outputs.app_manifest }}
          ANALYTICS_MANIFEST: ${{ steps.pick.outputs.analytics_manifest }}
        run: |
          set -euo pipefail

          sql() { # $1=compose cmd  $2=service  $3=query, against $DB_DATABASE
            $1 exec -T "$2" sh -c "export MYSQL_PWD=\"\$DB_PASSWORD\"; mysql -h 127.0.0.1 -N -u\"\$DB_USERNAME\" \"\$DB_DATABASE\" -e \"$3\""
          }

          sql_analytics() { # same, against $DB_ANALYTICS_DATABASE
            $1 exec -T "$2" sh -c "adb=\"\${DB_ANALYTICS_DATABASE:-temari_analytics}\"; export MYSQL_PWD=\"\$DB_PASSWORD\"; mysql -h 127.0.0.1 -N -u\"\$DB_USERNAME\" \"\$adb\" -e \"$3\""
          }

          fail=0

          check_tables() { # $1=sql-fn  label
            local fn="$1" label="$2"
            local live_tables throwaway_tables missing
            live_tables=$("$fn" "$LIVE_COMPOSE" "$LIVE_SERVICE" "SHOW TABLES" | sort)
            throwaway_tables=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SHOW TABLES" | sort)
            missing=$(comm -23 <(printf '%s\n' "$live_tables") <(printf '%s\n' "$throwaway_tables"))
            if [ -n "$missing" ]; then
              echo "::error::$label — tables missing from the throwaway restore:"
              printf '%s\n' "$missing"
              fail=1
            else
              echo "$label — throwaway has every live table."
            fi
          }

          check_counts() { # $1=sql-fn  $2=schema  $3=table
            local fn="$1" schema="$2" table="$3" live_n throwaway_n live_status throwaway_status live_err throwaway_err
            live_err="$(mktemp)"
            throwaway_err="$(mktemp)"
            if live_n=$("$fn" "$LIVE_COMPOSE" "$LIVE_SERVICE" "SELECT COUNT(*) FROM $table" 2>"$live_err"); then
              live_status=0
            else
              live_status=$?
            fi
            if throwaway_n=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SELECT COUNT(*) FROM $table" 2>"$throwaway_err"); then
              throwaway_status=0
            else
              throwaway_status=$?
            fi
            if ! scripts/deploy/check-restore-counts.sh "$schema" "$table" "$live_status" "$live_n" "$throwaway_status" "$throwaway_n" "$live_err" "$throwaway_err"; then
              fail=1
            fi
            rm -f "$live_err" "$throwaway_err"
          }

          check_manifest() { # $1=sql-fn  $2=schema  $3=manifest
            local fn="$1" schema="$2" manifest="$3" query restored
            if [ ! -f "$manifest" ]; then
              echo "::warning::$schema — no manifest at $manifest, so this dump predates manifests; count check skipped."
              return 0
            fi
            query=$("$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "SHOW TABLES" | scripts/deploy/count-rows-query.sh)
            restored="$(mktemp)"
            "$fn" "docker compose -p $RESTORE_PROJECT -f $RESTORE_COMPOSE_FILE" "$RESTORE_SERVICE" "$query" > "$restored"
            if ! scripts/deploy/check-restore-manifest.sh "$schema" "$manifest" "$restored"; then
              fail=1
            fi
            rm -f "$restored"
          }

          if [ "$KIND" = "nightly" ]; then
            echo "== default schema (against the dump-time manifest) =="
            check_manifest sql "default" "$APP_MANIFEST"

            echo "== analytics schema (against the dump-time manifest) =="
            check_manifest sql_analytics "analytics" "$ANALYTICS_MANIFEST"
          else
            echo "== default schema =="
            check_tables sql "default"
            for t in users activities ai_analyses planned_sessions; do
              check_counts sql "default" "$t"
            done

            echo "== analytics schema =="
            check_tables sql_analytics "analytics"
            check_counts sql_analytics "analytics" ai_token_usages
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::restore dry-run FAILED verification"
            exit 1
          fi
          echo "restore dry-run PASSED verification"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.ref != ''
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the ref's image
        if: inputs.ref != ''
        timeout-minutes: 15
        run: docker pull "$REHEARSAL_IMAGE"

      - name: Write the rehearsal env file
        if: inputs.ref != ''
        timeout-minutes: 2
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: |
          set -euo pipefail

          restore_env() {
            docker compose -p "$RESTORE_PROJECT" -f "$RESTORE_COMPOSE_FILE" exec -T "$RESTORE_SERVICE" printenv "$1"
          }

          db_database=$(restore_env DB_DATABASE)
          db_username=$(restore_env DB_USERNAME)
          db_password=$(restore_env DB_PASSWORD)
          db_analytics_database=$(restore_env DB_ANALYTICS_DATABASE || true)
          app_key="base64:$(head -c 32 /dev/urandom | base64)"

          single_quotable() {
            case "$2" in
              *"'"* | *'\') echo "::error::$1 holds a single quote or a trailing backslash, which the generated env file can't carry"; exit 1 ;;
            esac
          }
          single_quotable DB_DATABASE "$db_database"
          single_quotable DB_USERNAME "$db_username"
          single_quotable DB_PASSWORD "$db_password"
          single_quotable DB_ANALYTICS_DATABASE "$db_analytics_database"

          umask 077
          {
            echo "DB_HOST='mysql_restore'"
            echo "DB_DATABASE='$db_database'"
            echo "DB_USERNAME='$db_username'"
            echo "DB_PASSWORD='$db_password'"
            echo "DB_ANALYTICS_DATABASE='${db_analytics_database:-temari_analytics}'"
            echo "APP_KEY='$app_key'"
            echo "QUEUE_CONNECTION='null'"
            echo "CACHE_STORE='array'"
            echo "SESSION_DRIVER='array'"
            echo "MAIL_MAILER='array'"
            echo "BROADCAST_CONNECTION='null'"
            echo "PULSE_ENABLED='false'"
          } > "$REHEARSAL_ENV_FILE"

      - name: Migrate the restore on the ref's image
        if: inputs.ref != ''
        timeout-minutes: 10
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: $REHEARSAL_COMPOSE run --rm --no-deps app_rehearsal php artisan migrate --force

      - name: Migrate the restore's analytics schema
        if: inputs.ref != ''
        timeout-minutes: 10
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: $REHEARSAL_COMPOSE run --rm --no-deps app_rehearsal php artisan migrate --database=analytics --path=database/migrations/analytics --force

      # migrate:status --pending=1 exits non-zero when a schema has pending migrations.
      - name: Require no pending migrations on either connection
        if: inputs.ref != ''
        timeout-minutes: 2
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: |
          set -euo pipefail
          fail=0
          if ! $REHEARSAL_COMPOSE run --rm --no-deps app_rehearsal php artisan migrate:status --pending=1; then
            echo "::error::default connection: migrations still pending after migrate (or migrate:status failed)"
            fail=1
          fi
          if ! $REHEARSAL_COMPOSE run --rm --no-deps app_rehearsal php artisan migrate:status --database=analytics --path=database/migrations/analytics --pending=1; then
            echo "::error::analytics connection: migrations still pending after migrate (or migrate:status failed)"
            fail=1
          fi
          exit "$fail"

      - name: Tear down the throwaway stack
        if: always()
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$RESTORE_PROJECT" --filter "label=com.docker.compose.oneoff=True" \
            | xargs --no-run-if-empty docker rm -f
          if [ -n "$REF" ]; then
            $REHEARSAL_COMPOSE down -v
          else
            docker compose -p "$RESTORE_PROJECT" -f "$RESTORE_COMPOSE_FILE" down -v
          fi
          {
            echo "## Restore dry-run"
            if [ "${{ job.status }}" = "success" ]; then
              echo "PASS — \`${{ steps.pick.outputs.label }}\` restored clean into a throwaway database and verified (nightly: against its dump-time manifest; pre-deploy: against live)."
            else
              echo "FAIL — \`${{ steps.pick.outputs.label }}\`, see the Verify step above."
            fi
            if [ -n "$REF" ]; then
              if [ "${{ job.status }}" = "success" ]; then
                echo "Rehearsal PASS — \`$REF\` at \`$REHEARSAL_SHA\` migrated \`${{ steps.pick.outputs.label }}\` with nothing pending on either connection."
              else
                echo "Rehearsal FAIL — \`$REF\` at \`$REHEARSAL_SHA\` on \`${{ steps.pick.outputs.label }}\`, see the first failed step above."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the rehearsal env file and image
        if: always() && inputs.ref != ''
        timeout-minutes: 2
        env:
          REHEARSAL_ENV_FILE: ${{ runner.temp }}/rehearsal-app-env
        run: |
          rm -f "$REHEARSAL_ENV_FILE"
          image_id() { docker image inspect "$1" --format '{{.Id}}' 2>/dev/null || true; }
          pulled=$(image_id "$REHEARSAL_IMAGE")
          if [ -z "$pulled" ]; then
            echo "No local $REHEARSAL_IMAGE to remove."
          elif [ "$pulled" = "$(image_id temari/app:latest)" ] || [ "$pulled" = "$(image_id temari/app:previous)" ]; then
            echo "$REHEARSAL_IMAGE is temari/app:latest or :previous; keeping it."
          else
            docker rmi "$REHEARSAL_IMAGE"
          fi

  notify:
    needs: [build, restore-dry-run]
    if: always() && (needs.build.result == 'failure' || needs.restore-dry-run.result == 'failure')
    uses: ./.github/workflows/maintainer-alert.yml
    with:
      message: Restore dry-run (${{ inputs.kind || 'nightly' }}${{ inputs.ref && format(', ref {0}', inputs.ref) || '' }}) ${{ needs.build.result == 'failure' && 'failed building the ref''s image on the hosted runner' || 'failed on the homelab runner, possibly before any step ran' }}.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
