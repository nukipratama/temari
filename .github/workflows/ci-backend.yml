name: CI · Backend

on:
  workflow_call:
    inputs:
      full:
        description: 'run the whole backend suite; false runs only the DB-free structure tests'
        type: boolean
        required: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: inputs.full
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Backgrounded so the image pull and InnoDB init overlap PHP setup.
      - name: Start MySQL
        run: |
          docker run -d --name mysql --tmpfs /var/lib/mysql:rw -p 127.0.0.1::3306 \
            -e MYSQL_ROOT_PASSWORD=password -e MYSQL_DATABASE=temari_testing \
            -e MYSQL_USER=sail -e MYSQL_PASSWORD=password \
            mysql:9.7@sha256:86b390ef642f89a0157d6215dee33ddc928b8b0ecab173117f56f6c40cb24eab \
            --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin --performance-schema=OFF \
            > "$RUNNER_TEMP/mysql-start.log" 2>&1 &

      - uses: ./.github/actions/start-redis
        with:
          wait: 'false'

      - uses: ./.github/actions/show-runner-resources
        with:
          workers-label: test workers

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: ${{ github.event_name == 'pull_request' && 'pcov' || 'none' }}
          classmap-authoritative: 'true'

      - name: Warn when CI's PHP patch differs from prod's image
        if: matrix.shard == 1
        run: |
          prod="$(sed -nE 's/^# = .*\(PHP ([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p' Dockerfile | head -n1)"
          ci="$(php -r 'echo PHP_VERSION;')"
          if [ -z "$prod" ]; then
            echo "::warning::Could not read the PHP patch from the Dockerfile header comment, so CI's PHP $ci was not compared with prod's image."
          elif [ "$ci" != "$prod" ]; then
            echo "::warning::CI runs PHP $ci but prod's image is PHP $prod; Dependabot's frankenphp bump will close the gap."
          fi

      - name: Stub .env for file-scanning tests
        run: cp .env.example .env

      # TCP ping: the entrypoint's init server answers only on the socket.
      - name: Wait for MySQL
        timeout-minutes: 3
        run: |
          until docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent 2>/dev/null; do
            sleep 1
          done
          echo "DB_PORT=$(docker port mysql 3306/tcp | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"

      - name: MySQL diagnostics
        if: failure()
        run: |
          cat "$RUNNER_TEMP/mysql-start.log" || true
          docker logs mysql || true

      - uses: ./.github/actions/wait-redis

      - name: Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: temari_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          SESSION_DRIVER: array
        run: |
          pr_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pest random order seed: ${{ github.run_id }}"
            pr_args+=(--coverage-php="coverage-shard-${{ matrix.shard }}.cov")
            pr_args+=(--order-by=random --random-order-seed="${{ github.run_id }}")
          fi

          ./vendor/bin/pest --parallel --processes="$(nproc)" \
            --shard="${{ matrix.shard }}/${SHARD_TOTAL}" \
            "${pr_args[@]}" \
            --exclude-group=structure 2>&1 | tee /tmp/pest-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Random order seed hint
        if: failure() && github.event_name == 'pull_request'
        run: echo "Pest ran in random order (seed ${{ github.run_id }}). Reproduce with \`./vendor/bin/sail bin pest --parallel --order-by=random --random-order-seed=${{ github.run_id }} --shard=${{ matrix.shard }}/${SHARD_TOTAL} --exclude-group=structure\`. A re-run reuses the seed, so push to get a new order." >> "$GITHUB_STEP_SUMMARY"

      - name: Pest summary
        if: always()
        run: |
          {
            echo "### Backend · Tests (Pest, shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/pest-output.txt \
              | grep -E "^[[:space:]]*(Tests|Duration|Parallel|Shard):" \
              | sed -E 's/^[[:space:]]*([A-Za-z]+):[[:space:]]*/| \1 | /; s/$/ |/'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.cov
          retention-days: 1

  coverage:
    name: coverage
    needs: [tests]
    if: inputs.full && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true

      - name: Merge shard coverage and check --min=95 on the whole suite
        id: merge
        run: |
          ./vendor/bin/phpcov merge --clover=coverage-merged-clover.xml coverage-shards

          # shellcheck disable=SC2016 # PHP variables are evaluated by php, so the shell must leave this snippet literal.
          php -r '
            $xml = simplexml_load_file("coverage-merged-clover.xml");
            $metrics = $xml->project->metrics;
            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $pct = $statements > 0 ? ($covered / $statements) * 100 : 100.0;
            printf("Merged coverage: %.2f%% (%d/%d executable lines)\n", $pct, $covered, $statements);
            $min = 95.0;
            if ($pct < $min) {
              fwrite(STDERR, sprintf("FAIL: merged coverage %.1f%% is below the required %.1f%%.\n", floor($pct * 10) / 10, $min));
              exit(1);
            }
          '

      - name: Coverage summary
        if: always() && steps.merge.outcome != 'skipped'
        run: |
          {
            echo "### Backend · Coverage (merged, $(find coverage-shards -name '*.cov' | wc -l)-way shard)"
            echo ""
            if [ -f coverage-merged-clover.xml ]; then
              # shellcheck disable=SC2016 # PHP variables are evaluated by php, so the shell must leave this snippet literal.
              php -r '
              $xml = @simplexml_load_file("coverage-merged-clover.xml");
              if ($xml === false) { exit(0); }
              $metrics = $xml->project->metrics;
              $statements = (int) $metrics["statements"];
              $covered = (int) $metrics["coveredstatements"];
              $pct = $statements > 0 ? ($covered / $statements) * 100 : 100.0;
              echo "| | |\n| --- | --- |\n";
              printf("| Lines | %.1f%% (%d/%d) |\n", $pct, $covered, $statements);
              '
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Full git history: the guard diffs the migrations against the PR base or the pushed-over commit.
  migration-guard:
    name: migration-guard
    if: inputs.full
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Reject unmarked destructive migrations
        env:
          MIGRATION_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-migration-safety.php --base "$MIGRATION_DIFF_BASE"

  # When the full suite is skipped but a file only the DB-free structure tests read changed.
  # A full run covers these tests in static analysis.
  structure:
    name: structure
    if: ${{ !inputs.full }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env for file-scanning tests
        run: cp .env.example .env

      - uses: ./.github/actions/start-redis

      - name: Backend structure tests
        env:
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --group=structure

  static-analysis:
    name: static analysis
    if: inputs.full
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/start-redis
        with:
          wait: 'false'

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Stub .env for tools that boot the app
        run: cp .env.example .env

      - uses: ./.github/actions/wait-redis

      - name: Restore PHPStan analyser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpstan-cache
          key: phpstan-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('phpstan.neon') }}-${{ github.run_id }}
          restore-keys: phpstan-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('phpstan.neon') }}-

      - name: Restore Rector analyser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rector-cache
          key: rector-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'rector.php') }}-${{ github.run_id }}
          restore-keys: rector-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'rector.php') }}-

      - name: Restore Pint cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pint-cache
          key: pint-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'pint.json') }}-${{ github.run_id }}
          restore-keys: pint-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'pint.json') }}-

      - name: Pint (code style)
        id: pint
        if: ${{ !cancelled() }}
        run: vendor/bin/pint --test --cache-file=.pint-cache

      - name: Save Pint cache
        if: ${{ !cancelled() && steps.pint.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pint-cache
          key: pint-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'pint.json') }}-${{ github.run_id }}

      - name: PHPStan
        id: phpstan
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --no-progress

      - name: Save PHPStan analyser cache
        if: ${{ !cancelled() && steps.phpstan.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpstan-cache
          key: phpstan-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('phpstan.neon') }}-${{ github.run_id }}

      - name: Rector (dry-run)
        id: rector
        if: ${{ !cancelled() }}
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: Save Rector analyser cache
        if: ${{ !cancelled() && steps.rector.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rector-cache
          key: rector-${{ runner.os }}-${{ runner.arch }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'rector.php') }}-${{ github.run_id }}

      - name: Check {@see} references resolve
        if: ${{ !cancelled() }}
        run: php scripts/check-see-references.php

      - name: Class/test 1:1 structure check
        if: ${{ !cancelled() }}
        env:
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --group=structure
