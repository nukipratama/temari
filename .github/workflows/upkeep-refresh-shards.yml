name: Upkeep · Refresh shards

# Regenerates the per-class timings in tests/.pest/shards.json (docs/decisions/sharded-pr-coverage.md)
# weekly and opens or updates one PR when scripts/compare-shards.php finds the drift material.
# Runs on a hosted runner, serially without --parallel, so the timings stay per-class.
# The PR is opened with GITHUB_TOKEN, so its CI does not start on its own; re-run it before merging.

on:
  schedule:
    # Mondays 02:05 WIB, off the hour and clear of the nightly audit at 03:17.
    - cron: '5 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-shards
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  refresh-shards:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 28
    services:
      mysql:
        image: mysql:9.7@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: temari_testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports: ['0:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s --health-timeout=2s --health-retries=10
          --tmpfs /var/lib/mysql:rw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: 'pcov'
          classmap-authoritative: 'true'

      - name: Stub .env for file-scanning tests
        run: cp .env.example .env

      - uses: ./.github/actions/start-redis

      - name: Snapshot the current shard map
        run: cp tests/.pest/shards.json /tmp/shards-old.json

      - name: Regenerate shards.json
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: temari_testing
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          SESSION_DRIVER: array
        run: ./vendor/bin/pest --compact --update-shards --exclude-group=structure --coverage-php=/dev/null

      - name: Compare shard balance
        id: compare
        run: |
          php scripts/compare-shards.php \
            --old=/tmp/shards-old.json \
            --new=tests/.pest/shards.json \
            --body-out=/tmp/pr-body.md >> "$GITHUB_OUTPUT"

      - name: Step summary
        run: echo "${{ steps.compare.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the refresh PR
        if: steps.compare.outputs.decision == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- tests/.pest/shards.json; then
            echo "shards.json unchanged on disk, nothing to push."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B chore/refresh-shards
          git add tests/.pest/shards.json
          git -c core.hooksPath=/dev/null commit -m 'ci(shards): refresh timings'

          git fetch origin chore/refresh-shards || true
          git push --force-with-lease origin chore/refresh-shards

          open_pr=$(gh pr list --head chore/refresh-shards --state open --json number --jq '.[0].number // empty')

          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head chore/refresh-shards \
              --title 'ci(shards): refresh shard timings' \
              --body-file /tmp/pr-body.md
          fi
