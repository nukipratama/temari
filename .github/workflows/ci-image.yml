name: CI · Image

on:
  workflow_call:
    inputs:
      inspect:
        description: 'load the image and assert its entries and PHP patch'
        type: boolean
        required: true

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  # Produces the image release-deploy.yml pulls after a main push, and on a PR proves a
  # Dockerfile/composer change still builds. ~40s off a warm cache.
  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A PR build validates only: it reads the shared buildcache but never
      # publishes a tag or writes the cache back, so it can't displace main's.
      - name: Build and push the runtime image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', env.APP_IMAGE) || '' }}
          provenance: false

      # release-deploy.yml pulls this exact digest, so a later repush of the tag can't
      # change what ships.
      - name: Record the pushed image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-push-action returned no image digest (got '$DIGEST')"
            exit 1
          fi
          printf '%s\n' "$DIGEST" > image-digest.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: app-image-digest
          path: image-digest.txt
          retention-days: 30

      - name: Load the runtime image locally
        if: inputs.inspect
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: temari-app:contents
          provenance: false

      - name: Assert the shipped app entries
        if: inputs.inspect
        env:
          EXPECTED_ENTRIES: >-
            app artisan bootstrap composer.json composer.lock config database docker
            package-lock.json package.json public resources routes storage tsconfig.json
            vendor vite.config.ts
        run: |
          expected=$(tr -s ' ' '\n' <<< "$EXPECTED_ENTRIES" | sort)
          actual=$(docker run --rm --entrypoint ls temari-app:contents -A /var/www/html | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::/var/www/html differs from the expected entries. Change the .dockerignore allow-list and EXPECTED_ENTRIES together."
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi

      - name: Assert the Dockerfile header names the image's PHP patch
        if: inputs.inspect
        run: |
          header="$(sed -nE 's/^# = .*\(PHP ([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p' Dockerfile | head -n1)"
          actual="$(docker run --rm --entrypoint php temari-app:contents -r 'echo PHP_VERSION;')"
          if [ "$header" != "$actual" ]; then
            echo "::error::The built image runs PHP ${actual} but the Dockerfile header says PHP ${header:-unreadable}. Update the '(PHP x.y.z)' header comment in the same PR that bumps the frankenphp digest."
            exit 1
          fi
