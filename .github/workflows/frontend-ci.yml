name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

env:
  FRONTEND_SHARD_TOTAL: 3

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/show-runner-resources
        with:
          workers-label: vitest workers

      - uses: ./.github/actions/setup-node

      - name: Vitest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx vitest run \
              --shard="${{ matrix.shard }}/${FRONTEND_SHARD_TOTAL}" \
              --coverage \
              --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
              --reporter=blob --reporter=default \
              --outputFile=".vitest-reports/blob-${{ matrix.shard }}.json"
          else
            npx vitest run --shard="${{ matrix.shard }}/${FRONTEND_SHARD_TOTAL}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1

      - name: Build assets
        if: github.event_name != 'pull_request' && matrix.shard == 1
        run: npm run build

      - name: Entry chunk guard (first-paint budget)
        if: github.event_name != 'pull_request' && matrix.shard == 1
        run: npm run check:chunks

  gate:
    name: gate
    needs: [tests, static-analysis]
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - name: Require all frontend checks
        run: |
          [ "${{ needs.tests.result }}" = "success" ] || { echo "::error::frontend tests did not pass (${{ needs.tests.result }})"; exit 1; }
          [ "${{ needs.static-analysis.result }}" = "success" ] || { echo "::error::frontend static analysis did not pass (${{ needs.static-analysis.result }})"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'

      - uses: ./.github/actions/setup-node
        if: github.event_name == 'pull_request'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge shard reports and check coverage thresholds on the whole suite
        id: merge
        if: github.event_name == 'pull_request'
        run: npx vitest run --mergeReports=.vitest-reports --coverage

      - name: Vitest summary
        if: always() && steps.merge.outcome != 'skipped'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Frontend · Tests (Vitest, ${{ env.FRONTEND_SHARD_TOTAL }}-way shard)"
              echo ""
              echo "| Metric | % | Covered / Total |"
              echo "| --- | --- | --- |"
              jq -r '.total | to_entries[] | select(.key as $k | ["lines","functions","statements","branches"] | index($k)) | "| \(.key | ascii_upcase[0:1] + .[1:]) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build assets
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Entry chunk guard (first-paint budget)
        if: github.event_name == 'pull_request'
        run: npm run check:chunks

  static-analysis:
    name: static analysis
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

      - name: Component/test 1:1 structure check
        if: ${{ !cancelled() }}
        run: npx vitest run resources/js/test/structure.test.ts

      - name: Raw Tailwind palette guard
        if: ${{ !cancelled() }}
        run: npm run check:palette
