name: CI · Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FRONTEND_SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/show-runner-resources
        with:
          workers-label: vitest workers

      - uses: ./.github/actions/setup-node

      - name: Vitest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Vitest shuffle seed: ${{ github.run_id }}"
            npx vitest run \
              --shard="${{ matrix.shard }}/${FRONTEND_SHARD_TOTAL}" \
              --sequence.shuffle --sequence.seed="${{ github.run_id }}" \
              --coverage \
              --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 \
              --reporter=blob --reporter=default \
              --outputFile=".vitest-reports/blob-${{ matrix.shard }}.json"
          else
            npx vitest run --shard="${{ matrix.shard }}/${FRONTEND_SHARD_TOTAL}"
          fi

      - name: Shuffle seed hint
        if: failure() && github.event_name == 'pull_request'
        run: echo "Vitest ran in shuffled order (seed ${{ github.run_id }}). Reproduce with \`./vendor/bin/sail npx vitest run --sequence.shuffle --sequence.seed=${{ github.run_id }} --shard=${{ matrix.shard }}/${FRONTEND_SHARD_TOTAL}\`. A re-run reuses the seed, so push to get a new order." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1

  coverage:
    name: coverage
    needs: [tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge shard reports and check coverage thresholds on the whole suite
        id: merge
        run: npx vitest run --mergeReports=.vitest-reports --coverage

      - name: Vitest summary
        if: always() && steps.merge.outcome != 'skipped'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Frontend · Tests (Vitest, $(find .vitest-reports -name 'blob-*.json' | wc -l)-way shard)"
              echo ""
              echo "| Metric | % | Covered / Total |"
              echo "| --- | --- | --- |"
              jq -r '.total | to_entries[] | select(.key as $k | ["lines","functions","statements","branches"] | index($k)) | "| \(.key | ascii_upcase[0:1] + .[1:]) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' coverage/coverage-summary.json
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Build assets
        run: npm run build

      - name: Entry chunk guard (first-paint budget)
        run: npm run check:chunks

  static-analysis:
    name: static analysis
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

      - name: Component/test 1:1 structure check
        if: ${{ !cancelled() }}
        run: npx vitest run resources/js/test/structure.test.ts

      - name: Raw Tailwind palette guard
        if: ${{ !cancelled() }}
        run: npm run check:palette
