name: Start Redis
description: Start Redis on 127.0.0.1:6379 with 256 databases, the layout tests/TestCase.php gives each parallel worker
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run -d --name redis -p 127.0.0.1:6379:6379 \
          redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0 \
          redis-server --save '' --appendonly no --databases 256
        until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do
          sleep 1
        done
