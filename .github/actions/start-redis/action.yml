name: Start Redis
description: Start Redis on 127.0.0.1:6379 with 256 databases, the layout tests/TestCase.php gives each parallel worker
inputs:
  wait:
    description: "'false' returns at once so the pull and boot overlap later steps; call wait-redis before Redis is needed"
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run -d --name redis -p 127.0.0.1:6379:6379 \
          redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537 \
          redis-server --save '' --appendonly no --databases 256 \
          > "$RUNNER_TEMP/redis-start.log" 2>&1 &

    - if: inputs.wait == 'true'
      uses: ./.github/actions/wait-redis
