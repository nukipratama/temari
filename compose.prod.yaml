name: temari-prod

x-app-image: &app-image temari/app:latest

# Bound every container's json-file sink so a runaway stderr stream can't fill
# the host disk. Shared by app-tier, mysql, and both redis instances.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Secrets and per-host config (APP_KEY, DB creds, STRAVA creds, feature flags)
# live in /opt/temari/.env on the host — root-owned, 640, runner-readable.
# Compose loads them via env_file: on each service. Nothing flows through GitHub
# Actions secrets anymore.
x-app-env-file: &app-env-file
  - /opt/temari/.env

x-app-env: &app-env
  APP_NAME: "Temari - Setiap Langkah Berarti"
  APP_ENV: production
  APP_DEBUG: "false"
  # stack fans out to both: daily = persisted rotated history (survives deploys
  # via the app_logs volume), stderr = live `docker compose logs`. Both channels
  # are defined in config/logging.php.
  LOG_CHANNEL: stack
  LOG_STACK: "daily,stderr"
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  # Two Redis instances. `redis` (durable: noeviction + AOF) holds queue +
  # Horizon state + sessions (DB 0) and the Pulse ingest buffer (DB 2).
  # `redis-cache` (allkeys-lru, no AOF) holds the cache keyspace so cache
  # growth can never hit noeviction and wedge queue enqueues / session writes.
  # Both listen on REDIS_PORT.
  REDIS_HOST: redis
  REDIS_CACHE_HOST: redis-cache
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # Sessions live on the durable `redis` (DB 0, noeviction). Cache lives on the
  # dedicated `redis-cache` instance (DB 1 there), free to evict under pressure.
  SESSION_CONNECTION: default
  CACHE_STORE: redis
  # Fixed literals, not derived from APP_NAME: docs/decisions/fixed-session-cookie.md.
  SESSION_COOKIE: temari-setiap-langkah-berarti-session
  REDIS_PREFIX: temari-setiap-langkah-berarti-database-
  CACHE_PREFIX: temari-setiap-langkah-berarti-cache-
  PULSE_ENABLED: "true"
  # Stable name so the Servers card isn't a random per-container hash. Ingest is
  # buffered in Redis DB 2 (drained by the pulse service).
  PULSE_SERVER_NAME: temari-prod
  PULSE_INGEST_DRIVER: redis
  PULSE_REDIS_CONNECTION: pulse
  PULSE_REDIS_HOST: redis
  PULSE_REDIS_DB: "2"
  # Servers recorder runs in the pulse service, which bind-mounts an empty host
  # directory on the root filesystem read-only at /host-disk, so the disk metric
  # reflects the real host disk without exposing the host's files.
  PULSE_SERVER_DIRECTORIES: "/host-disk"
  OCTANE_SERVER: frankenphp
  # NOTE: the runtime boots the Caddyfile worker directive, not `octane:start`,
  # so these two are inert here — the live recycle/sizing knobs are `num` and
  # `max_requests` in docker/Caddyfile. Kept (not deleted) to avoid churn and
  # to stay correct if we ever switch to octane:start.
  OCTANE_MAX_REQUESTS: "2000"
  FRANKENPHP_NUM_WORKERS: "2"

x-redis-prod-base: &redis-prod-base
  # Digest-pinned (like the app + mysql images) so a floating-tag repush can't
  # drift the cache/queue engine on a cold pull. Refresh after a bump with:
  #   docker buildx imagetools inspect redis:8.10-alpine --format '{{.Manifest.Digest}}'
  image: redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
  restart: unless-stopped
  networks: [internal]
  logging: *logging
  # The `sh -c` command bypasses the image entrypoint's drop to the redis user, so
  # redis-server runs as root and writes into the redis-owned /data through
  # DAC_OVERRIDE alone; every other capability is dropped.
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - DAC_OVERRIDE
  security_opt:
    - no-new-privileges:true
  # env_file so the container has REDIS_PASSWORD for `--requirepass` (see each
  # service's command) and the authed healthcheck below — loaded from the host
  # /opt/temari/.env, same as mysql/app. Absolute path, so it resolves the same
  # regardless of the directory the deploy runs `docker compose` from.
  env_file: *app-env-file
  healthcheck:
    # SET (not ping): Redis answers PONG while still loading the AOF but rejects writes.
    # REDISCLI_AUTH is exported only when REDIS_PASSWORD is non-empty, since a bare `AUTH ""` is rejected.
    test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli SET __hc__ 1 EX 5"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 30s

x-app-base: &app-base
  image: *app-image
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: *app-env-file
  environment: *app-env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  networks: [internal]
  volumes:
    # Persist rotated daily logs across container recreation (deploys).
    - app_logs:/var/www/html/storage/logs
  logging: *logging
  # Non-root app tier: drop all caps, but keep NET_BIND_SERVICE — the FrankenPHP
  # binary carries it as a file capability (getcap: cap_net_bind_service=ep), so an
  # empty bounding set makes the kernel refuse to exec it (EPERM "Operation not
  # permitted"). no-new-privileges blocks setuid escalation.
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true
  # Read-only root filesystem. The tmpfs paths are everything the tier writes
  # outside the logs volume: the opcache file cache, Caddy's state, tinker
  # history, compiled views, the `artisan down` stub and the `artisan optimize`
  # caches (the mount hides the baked packages.php and services.php, which
  # Laravel rebuilds at boot). uid/gid 82 is the image's www-data, since a tmpfs
  # mount is otherwise root-owned.
  read_only: true
  tmpfs:
    - /tmp
    - /tmp/opcache:uid=82,gid=82
    - /data/caddy:uid=82,gid=82
    - /config/caddy:uid=82,gid=82
    - /config/psysh:uid=82,gid=82
    - /var/www/html/storage/framework:uid=82,gid=82
    - /var/www/html/storage/framework/views:uid=82,gid=82
    - /var/www/html/bootstrap/cache:uid=82,gid=82

services:
  app:
    <<: *app-base
    ports:
      # Loopback only — cloudflared on the host reaches it via 127.0.0.1:7001.
      - "127.0.0.1:7001:7001"
    # FrankenPHP doesn't exit early while connections are open, so it always rides out the grace
    # period under live traffic; 3s bounds that wait to what a normal page render finishes inside.
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7001/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        # Floor: guarantee a slice during CI/build bursts on the shared 4-core
        # host. Floors for app+mysql+redis sum to 1.5 vCPU, well under 4.
        reservations:
          cpus: "0.75"

  horizon:
    <<: *app-base
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 390s
    # Override the image's HTTP healthcheck: a wedged supervisor keeps the
    # container alive but stops processing. horizon:status exits 0 running,
    # 1 paused, 2 inactive — so paused/dead both surface as `unhealthy`.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"

  # Replaces the image's HTTP healthcheck: `schedule:heartbeat --check` fails when the
  # minute-cadence heartbeat stamp is older than 300s.
  scheduler:
    <<: *app-base
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:heartbeat", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"

  # Combined Pulse daemon: pulse:check (Servers recorder) + pulse:work (ingest drain).
  # Bind-mounts an empty host directory on the root filesystem read-only, so the
  # disk metric reflects the real host disk.
  # $$ escapes Compose interpolation of the PID variables. Polls both PIDs because busybox
  # sh has no portable `wait -n`. The shell is PID 1, so the `trap` is what makes SIGTERM take effect.
  pulse:
    <<: *app-base
    command:
      - "/bin/sh"
      - "-c"
      - |
        trap 'kill $$PULSE_CHECK_PID $$PULSE_WORK_PID 2>/dev/null; wait; exit 0' TERM INT
        php artisan pulse:check &
        PULSE_CHECK_PID=$!
        php artisan pulse:work &
        PULSE_WORK_PID=$!
        # Exit (triggering Docker restart) as soon as either child dies.
        while kill -0 "$$PULSE_CHECK_PID" 2>/dev/null && kill -0 "$$PULSE_WORK_PID" 2>/dev/null; do
            sleep 1
        done
        kill $$PULSE_CHECK_PID $$PULSE_WORK_PID 2>/dev/null
        wait
    # Backstop only; the trap exits on SIGTERM.
    stop_grace_period: 10s
    volumes:
      - app_logs:/var/www/html/storage/logs
      - /var/lib/temari-pulse:/host-disk:ro
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"

  mysql:
    # Custom image = stock mysql + mysqlbinlog + the bootstrap baked into initdb (see docker/mysql/
    # Dockerfile), so a fresh volume self-initializes on any machine. No workflow builds
    # or recreates it: an image change is the manual "Upgrading MySQL" window in
    # docs/architecture/deployment.md.
    image: temari/mysql:9.7.4
    build:
      context: ./docker/mysql
    restart: unless-stopped
    env_file: *app-env-file
    command:
      - "--innodb-buffer-pool-size=1536M"
      - "--innodb-redo-log-capacity=536870912"
      - "--innodb-flush-log-at-trx-commit=2"
      - "--innodb-flush-method=O_DIRECT"
      # app workers + horizon (≤10) + scheduler + adhoc artisan ≈ 25 peak.
      - "--max-connections=40"
      - "--performance-schema=OFF"
      # Skip reverse-DNS on every TCP connect — every connection from the
      # Octane workers is a hot path.
      - "--skip-name-resolve"
      - "--binlog-expire-logs-seconds=604800"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    logging: *logging
    # The entrypoint starts as root, reads and chowns the data directory, then
    # switches to the mysql user; these are the capabilities that path needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # CMD-SHELL form + $$ defers interpolation to runtime inside the container
      # so MYSQL_ROOT_PASSWORD doesn't leak into `docker inspect` plaintext, and
      # MYSQL_PWD keeps it off mysqladmin's command line in the process table.
      # -h 127.0.0.1 forces TCP — UNIX socket is up before the listener.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
        # Floor: keep the DB responsive when a deploy build saturates the host.
        reservations:
          cpus: "0.5"

  # Durable Redis, DB-level separation, noeviction so a full keyspace ERRORs
  # (never silently drops a durable key):
  #   DB 0 = queue jobs + Horizon state + sessions
  #   DB 2 = Pulse ingest buffer (PULSE_REDIS_DB=2)
  # Cache lives on the `redis-cache` instance below. AOF everysec gives queue durability.
  redis:
    <<: *redis-prod-base
    # /bin/sh -c so the container shell expands REDIS_PASSWORD from env_file into
    # --requirepass. $$ escapes Compose interpolation (same convention as pulse);
    # exec keeps redis-server as PID 1 so it receives Docker's stop signal.
    command:
      - "/bin/sh"
      - "-c"
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640m
        # Floor: queue/session store must not starve during build bursts.
        reservations:
          cpus: "0.25"

  # Dedicated cache Redis, split off `redis` above: allkeys-lru evicts under memory pressure,
  # and there is no AOF or persistence volume (a restart is a cold cache). Reuses the
  # redis-prod-base SET write-probe healthcheck.
  redis-cache:
    <<: *redis-prod-base
    # Same --requirepass wiring as `redis` above (uses REDIS_PASSWORD too — the
    # app's `cache` connection authenticates with REDIS_PASSWORD).
    command:
      - "/bin/sh"
      - "-c"
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly no
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    # No volume, so the read-only root needs a writable /data for its RDB snapshots.
    tmpfs:
      - /data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320m
        reservations:
          cpus: "0.1"

volumes:
  mysql_data:
  redis_data:
  app_logs:

networks:
  internal:
    driver: bridge
