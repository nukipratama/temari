<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1017">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f8">
    <title>Offline · Temari</title>
    <!--
        Served by the service worker when a navigation fails with no network.
        Deliberately standalone: no Vite assets, no fonts, no JS bundle — it has
        to render when nothing else can be fetched. Colours are the semantic
        tokens inlined, since the stylesheet is exactly what is unavailable, and
        the ground follows prefers-color-scheme rather than the 'temari-theme'
        key — the same trade the launch images already make.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --background: #f1f5f8;
            --foreground: #16181b;
            --muted-foreground: #60666d;
            --mark-base: #171f28;
            --mark-lead: #ade047;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0b1017;
                --foreground: #f1f5f8;
                --muted-foreground: #9c9ea7;
                --mark-base: #f1f5f8;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding:
                max(2rem, calc(env(safe-area-inset-top) + 1rem))
                max(1.5rem, env(safe-area-inset-right))
                max(2rem, env(safe-area-inset-bottom))
                max(1.5rem, env(safe-area-inset-left));
            background: var(--background);
            color: var(--foreground);
            text-align: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        svg { width: 96px; height: 96px; }
        .mark-base { stroke: var(--mark-base); }
        .mark-lead { stroke: var(--mark-lead); }
        h1 { margin: 0.5rem 0 0; font-size: 1.4rem; font-weight: 600; }
        p { margin: 0; max-width: 26rem; font-size: 0.9rem; line-height: 1.55; color: var(--muted-foreground); }
        button {
            margin-top: 0.75rem;
            padding: 0.7rem 1.4rem;
            border: 0;
            border-radius: 999px;
            background: var(--foreground);
            color: var(--background);
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Temari">
        <g fill="none" stroke-width="9" stroke-linecap="round">
            <path class="mark-lead" d="M50 14 A36 36 0 1 1 32 18.82"/>
            <path class="mark-base" d="M50 25 A25 25 0 1 1 28.35 62.5"/>
            <path class="mark-base" d="M50 36 A14 14 0 0 1 62.12 57"/>
        </g>
    </svg>
    <h1>No signal right now</h1>
    <p>I can't pull up your run data without a connection. Check your signal or wifi, then reload.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
